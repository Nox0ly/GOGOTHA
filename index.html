<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#060508">
<meta name="description" content="各各他山 GOLGOTHA — 邪典宗教风像素弹幕生存射击 Roguelite。Made By Nob0dyH3re">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23060508'/%3E%3Crect x='6' y='2' width='4' height='12' fill='%23ff8a1e'/%3E%3Crect x='2' y='6' width='12' height='4' fill='%23ff8a1e'/%3E%3Crect x='5' y='9' width='6' height='3' fill='%23c9a13f'/%3E%3C/svg%3E">
<title>各各他山 // GOLGOTHA</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=VT323&family=ZCOOL+QingKe+HuangYou&family=Ma+Shan+Zheng&display=swap');
@font-face{
  font-family:'Cubic11';
  src:url('https://cdn.jsdelivr.net/gh/TakWolf/fusion-pixel-font@2025.10.20/assets/fonts/cubic-11/Cubic_11.woff2') format('woff2');
  font-display:swap;
}
</style>
<style>
:root{
  --org:#ff8a1e; --org2:#ffc37a; --red:#ff4b5c; --bg:#060508;
  --panel:rgba(15,13,17,.88); --line:rgba(255,138,30,.35); --dim:#9aa0a6;
  --f:'VT323','Cubic11','ZCOOL QingKe HuangYou','Ma Shan Zheng',monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:var(--f)}
body{user-select:none;-webkit-user-select:none;color:#d8d3c8;letter-spacing:.06em}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#game{image-rendering:pixelated;image-rendering:crisp-edges;cursor:none;background:#0a0810;box-shadow:0 0 80px rgba(0,0,0,.9)}
canvas{display:block}

/* ---------- 氛围层 ---------- */
#vign{position:fixed;inset:0;pointer-events:none;z-index:55;
  background:radial-gradient(ellipse at center, transparent 52%, rgba(0,0,0,.42) 82%, rgba(0,0,0,.78) 100%);}
#dmgflash{position:fixed;inset:0;pointer-events:none;z-index:56;opacity:0;
  background:radial-gradient(ellipse at center, rgba(255,30,30,0) 40%, rgba(180,10,10,.55) 100%);transition:opacity .12s}
#whiteflash{position:fixed;inset:0;pointer-events:none;z-index:57;opacity:0;background:#fff3d8;transition:opacity .09s}
#healflash{position:fixed;inset:0;pointer-events:none;z-index:56;opacity:0;
  background:radial-gradient(ellipse at center, rgba(40,255,120,0) 50%, rgba(20,160,80,.25) 100%);transition:opacity .2s}
#scan{position:fixed;inset:0;pointer-events:none;z-index:70;opacity:.32;
  background:repeating-linear-gradient(0deg, rgba(0,0,0,.28) 0px, rgba(0,0,0,.28) 1px, transparent 1px, transparent 3px);}
#scanband{position:fixed;left:0;right:0;height:90px;pointer-events:none;z-index:71;opacity:.05;
  background:linear-gradient(180deg, transparent, #fff, transparent);animation:scanmove 7s linear infinite}
@keyframes scanmove{0%{top:-10%}100%{top:110%}}

/* ---------- 准星 ---------- */
#crosshair{position:fixed;z-index:45;pointer-events:none;display:none;mix-blend-mode:difference;transform:translate(-50%,-50%)}
#crosshair .cx{position:absolute;background:#fff}
#crosshair .cxh{width:14px;height:2px;left:-7px;top:-1px}
#crosshair .cxv{width:2px;height:14px;left:-1px;top:-7px}
#crosshair .cxd{width:3px;height:3px;left:-1.5px;top:-1.5px;background:#ff8a1e}
#crosshair.hit .cx{background:#ff4b5c}
#crosshair.hit .cxd{background:#fff}
#crosshair.reload .cx{animation:cxblink .12s steps(2) infinite}
@keyframes cxblink{50%{opacity:0}}

/* ---------- HUD 面板（全境封锁式） ---------- */
.hud{position:fixed;z-index:30;pointer-events:none;font-family:var(--f)}
.panel{background:var(--panel);border:1px solid var(--line);
  clip-path:polygon(0 0,calc(100% - 12px) 0,100% 12px,100% 100%,12px 100%,0 calc(100% - 12px));
  padding:10px 16px 12px}
.tag{color:var(--org);font-size:19px;letter-spacing:.18em;text-transform:uppercase;margin-bottom:5px}
.tag .sub{color:#8d8580;font-size:15px;margin-left:6px}
.num{font-size:26px;line-height:1}
.lbl{color:var(--dim);font-size:15px;margin-right:6px;letter-spacing:.15em}
/* UI 震动与弹跳（交互反馈） */
@keyframes hudkick{0%{translate:0 0}20%{translate:-4px 2px}40%{translate:3px -3px}60%{translate:-3px -2px}80%{translate:2px 2px}100%{translate:0 0}}
.hud.kick{animation:hudkick .18s steps(3)}
@keyframes pop{0%{transform:scale(1.7)}100%{transform:scale(1)}}
.pop{animation:pop .15s ease-out;display:inline-block}

#pTL{top:16px;left:16px;min-width:270px}
#hpsegs{display:inline-flex;gap:2px;vertical-align:middle}
.seg{width:17px;height:12px;background:#3a1414;transform:skewX(-14deg);border:1px solid rgba(255,255,255,.08)}
.seg.on{background:linear-gradient(180deg,#ffc37a,#ff8a1e);border-color:#ffd9a0;box-shadow:0 0 4px rgba(255,138,30,.5)}
.seg.low.on{background:linear-gradient(180deg,#ff6a5a,#c81e2e);box-shadow:0 0 5px rgba(200,30,46,.8)}
#xpbar{height:6px;background:#241a10;margin-top:6px;border:1px solid rgba(255,138,30,.25)}
#xpfill{display:block;height:100%;width:0%;background:linear-gradient(90deg,#b34d00,var(--org));transition:width .12s}
#lvlrow{margin-top:4px;font-size:16px;color:var(--dim)}
#lvlrow b{color:var(--org2);font-size:19px}
#comborow{margin-top:5px;font-size:15px;color:var(--dim)}
#comborow .combolbl{color:var(--org);letter-spacing:.2em;margin-right:4px}
#comborow b{font-size:22px;margin-right:6px}
#comborow b.c1{color:var(--org2);text-shadow:0 0 6px rgba(255,138,30,.6)}
#comborow b.c2{color:#ff5a4b;text-shadow:0 0 8px rgba(255,60,50,.7)}
#comborow b.c3{color:#c44bff;text-shadow:0 0 9px rgba(196,75,255,.8)}
#combobar{display:inline-block;width:46px;height:3px;background:#241a10;border:1px solid rgba(255,138,30,.25);vertical-align:middle}
#combofill{display:block;height:100%;width:0%;background:var(--org2);transition:width .05s linear}
#grazerow{margin-top:3px;font-size:14px;color:var(--dim)}
#grazerow b{color:#b8e0ff}
#scorerow{font-size:20px;color:#e8e2d4}
#scorerow b{color:var(--org2);font-size:26px;margin:0 3px}

#pTR{top:14px;right:14px;text-align:right}
#radar{width:116px;height:116px;image-rendering:pixelated;border:1px solid var(--line);background:#0c1016;
  clip-path:polygon(0 0,calc(100% - 8px) 0,100% 8px,100% 100%,8px 100%,0 calc(100% - 8px))}
#soulrow{margin-top:6px;font-size:17px;color:var(--dim)}
#soulrow b{color:#d9cbb0;font-size:20px;margin:0 3px}
#killrow{font-size:14px;color:var(--dim);margin-top:2px}

#pTC{top:16px;left:50%;transform:translateX(-50%);text-align:center;min-width:300px;padding:7px 30px}
#wavetxt{font-size:24px;color:#e8e2d4;letter-spacing:.14em}
#wavetxt i{color:var(--org);font-style:normal}
#wavetxt .dailytag{color:#ffd23f;font-size:13px;margin-left:8px;letter-spacing:.2em;text-shadow:0 0 6px rgba(255,210,63,.5)}
#hostile{font-size:15px;color:var(--dim);margin-top:2px}
#hostile b{color:var(--org2)}
#bosshint{font-size:14px;color:#ff5a4b;margin-top:2px;display:none;letter-spacing:.12em;text-shadow:0 0 6px rgba(255,60,50,.5)}
#calmtxt{font-size:13px;color:#7fb37f;margin-top:1px;display:none}

#pBL{bottom:18px;left:16px;min-width:310px}
#wslots{display:flex;gap:4px;margin-bottom:5px;pointer-events:auto}
#wslots .slot{pointer-events:auto;background:rgba(20,16,22,.92);border:1px solid rgba(255,138,30,.25);
  color:#9aa0a6;font-size:14px;padding:4px 7px;cursor:pointer;flex:1;text-align:center;
  clip-path:none;letter-spacing:.02em;line-height:1.2;min-width:0}
#wslots .slot:hover{border-color:var(--org2);color:#e8e2d4}
#wslots .slot.on{background:rgba(255,138,30,.22);border-color:var(--org);color:#fff;box-shadow:0 0 8px rgba(255,138,30,.35)}
#wslots .slot.rare{border-color:rgba(255,210,63,.7)}
#wslots .slot.rare.on{border-color:#ffd23f;box-shadow:0 0 8px rgba(255,210,63,.5)}
#wslots .slot .sk{color:var(--org);margin-right:4px;font-size:13px}
#wslots .slot i{display:block;font-style:normal;font-size:13px;color:#8d8580}
#wslots .slot.on i{color:#ffd9a0}
#wslots .slot.empty{opacity:.35}
#wname{font-size:17px;color:#e8e2d4}
#wname i{color:var(--org);font-style:normal;font-size:13px;margin-left:4px}
#ammo{font-size:34px;color:var(--org2);letter-spacing:.08em}
#ammo .res{color:#6e6660;font-size:18px}
#relwrap{height:4px;background:#241a10;margin-top:5px;border:1px solid rgba(255,138,30,.2)}
#relfill{display:block;height:100%;width:0%;background:var(--org2)}
#relhint{font-size:14px;color:var(--dim);margin-top:3px}

#pBR{bottom:16px;right:14px;text-align:right}
.piprow{margin-top:5px;font-size:15px;color:var(--dim)}
.pip{display:inline-block;width:13px;height:13px;background:#26202a;border:1px solid rgba(255,138,30,.3);margin-left:3px;transform:skewX(-14deg)}
.pip.on{background:var(--org);box-shadow:0 0 4px rgba(255,138,30,.6)}
.pip.f{background:#3d7a4a;border-color:#6fc383}
.pip.f.on{background:#5fd47c;box-shadow:0 0 4px rgba(95,212,124,.6)}

#bossbar{position:fixed;top:68px;left:50%;transform:translateX(-50%);z-index:30;width:420px;display:none;pointer-events:none}
#bossname{font-size:17px;color:var(--red);letter-spacing:.2em;text-align:center;margin-bottom:4px}
#bbwrap{height:9px;background:#1c0b0e;border:1px solid rgba(255,75,92,.4);transform:skewX(-14deg)}
#bbfill{height:100%;width:100%;background:linear-gradient(90deg,#7a0e1c,var(--red));transition:width .1s}

/* ---------- 横幅 / 提示 ---------- */
#banner{position:fixed;top:26%;left:50%;transform:translateX(-50%);z-index:40;text-align:center;pointer-events:none;opacity:0;width:80%}
#banner.show{animation:ban 2.6s steps(30) forwards}
@keyframes ban{0%{opacity:0;transform:translateX(-50%) translateY(8px)}8%{opacity:1;transform:translateX(-50%)}78%{opacity:1}100%{opacity:0;transform:translateX(-50%) translateY(-6px)}}
#banner .b1{font-size:34px;letter-spacing:.3em;color:#efe8d8;text-shadow:0 0 12px rgba(255,138,30,.45),2px 0 0 rgba(120,10,10,.6)}
#banner .b2{font-size:15px;color:var(--org);letter-spacing:.5em;margin-top:2px}
#banner .bbar{height:2px;background:linear-gradient(90deg,transparent,var(--org),transparent);margin:8px auto 0;width:60%}

#toast{position:fixed;bottom:70px;left:50%;transform:translateX(-50%);z-index:40;pointer-events:none;
  color:#b8b0a0;font-size:17px;letter-spacing:.1em;opacity:0;transition:opacity .4s;background:rgba(10,8,12,.7);padding:5px 14px;
  border:1px solid rgba(255,138,30,.25)}
#toast.show{opacity:1}

/* ---------- 全屏覆盖层 ---------- */
.scr{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;flex-direction:column;
  background:radial-gradient(ellipse at center, rgba(10,7,12,.86) 30%, rgba(4,3,6,.96) 100%)}
.scr .frame{position:relative;background:var(--panel);border:1px solid var(--line);
  clip-path:polygon(0 0,calc(100% - 18px) 0,100% 18px,100% 100%,18px 100%,0 calc(100% - 18px));
  padding:26px 40px 28px;min-width:520px;max-width:760px;max-height:88vh;overflow-y:auto}
.scr .frame::before{content:'';position:absolute;left:0;top:0;width:38%;height:3px;background:var(--org);box-shadow:0 0 12px rgba(255,138,30,.6)}
.scr h1{font-size:40px;letter-spacing:.28em;color:#efe8d8;font-weight:400;text-align:center;text-shadow:0 0 14px rgba(255,138,30,.35)}
.scr .en{text-align:center;color:var(--org);letter-spacing:.6em;font-size:14px;margin:2px 0 10px}
.scr .quote{text-align:center;color:#9a9188;font-size:14px;letter-spacing:.12em;margin-bottom:18px}
.scr .flavor{text-align:center;color:#6e6660;font-size:13px;margin-top:16px;min-height:18px}
.btnrow{display:flex;gap:14px;justify-content:center;margin-top:18px;flex-wrap:wrap}
button{font-family:var(--f);letter-spacing:.14em;background:rgba(255,138,30,.08);color:var(--org2);
  border:1px solid var(--line);padding:9px 26px;font-size:17px;cursor:pointer;
  clip-path:polygon(0 0,calc(100% - 10px) 0,100% 10px,100% 100%,10px 100%,0 calc(100% - 10px));transition:all .1s}
button:hover{background:rgba(255,138,30,.22);color:#fff;box-shadow:0 0 14px rgba(255,138,30,.35)}
button:active{transform:translateY(1px)}
button.primary{background:var(--org);color:#1a0d02;border-color:var(--org2);font-size:18px}
button.primary:hover{background:var(--org2);color:#000;box-shadow:0 0 20px rgba(255,138,30,.6)}
button.ghost{background:transparent;color:var(--dim)}
button.small{padding:4px 14px;font-size:14px}
button:disabled{opacity:.35;cursor:not-allowed;box-shadow:none}
.scr table{width:100%;border-collapse:collapse;font-size:15px}
.scr td{padding:5px 8px;border-bottom:1px solid rgba(255,255,255,.06);color:#b8b0a0}
.scr td.k{color:var(--dim);font-size:12px;letter-spacing:.15em;white-space:nowrap}
.kbd{border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.06);padding:0 7px;margin:0 2px;font-size:15px;color:#e8e2d4;white-space:nowrap}
.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px 26px;margin:14px 0;font-size:16px}
.statgrid .si{display:flex;justify-content:space-between;border-bottom:1px dashed rgba(255,255,255,.1);padding-bottom:3px}
.statgrid .si b{color:var(--org2);font-weight:400}
.deadbig{font-size:46px;color:var(--red);text-align:center;letter-spacing:.3em;text-shadow:0 0 18px rgba(200,20,40,.5)}

/* 卡片 */
.cards{display:flex;gap:14px;justify-content:center;margin-top:16px;flex-wrap:wrap}
.card{width:170px;min-height:200px;background:rgba(24,20,26,.94);border:1px solid #3a343e;position:relative;cursor:pointer;transition:all .12s;
  clip-path:polygon(0 0,calc(100% - 12px) 0,100% 12px,100% 100%,12px 100%,0 calc(100% - 12px));padding:14px 12px;display:flex;flex-direction:column}
.card:hover{transform:translateY(-5px);box-shadow:0 8px 24px rgba(0,0,0,.6)}
.card .tier{position:absolute;top:0;left:0;font-size:11px;letter-spacing:.2em;padding:2px 8px;color:#1a0d02}
.card .cname{font-size:21px;color:#efe8d8;margin-top:14px;line-height:1.15}
.card .cen{font-size:11px;color:var(--dim);letter-spacing:.25em;margin:2px 0 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .cdesc{font-size:13px;color:#b8b0a0;flex:1;line-height:1.35}
.card .cflav{font-size:12px;color:#6e6660;margin-top:8px;font-style:italic}
.card.t-common{border-color:#5a545e}.card.t-common .tier{background:#9aa0a6}.card.t-common:hover{border-color:#cfd4d8;box-shadow:0 0 14px rgba(160,168,176,.25)}
.card.t-rare{border-color:rgba(255,138,30,.55)}.card.t-rare .tier{background:var(--org)}.card.t-rare:hover{border-color:var(--org2);box-shadow:0 0 16px rgba(255,138,30,.35)}
.card.t-legend{border-color:rgba(196,75,255,.55)}.card.t-legend .tier{background:#c44bff;color:#fff}.card.t-legend:hover{border-color:#e5a5ff;box-shadow:0 0 18px rgba(196,75,255,.4)}

/* 商店 */
.shoprow{display:flex;align-items:center;gap:14px;padding:8px 6px;border-bottom:1px solid rgba(255,255,255,.07)}
.shoprow .sname{width:130px;color:#e8e2d4;font-size:16px}
.shoprow .sdesc{flex:1;color:#9a9188;font-size:13px}
.shoprow .pips{letter-spacing:2px;font-size:12px;color:var(--org);width:64px;text-align:center}
.shoprow .cost{width:86px;text-align:right;font-size:14px;color:#d9cbb0}
.souls{display:flex;justify-content:center;align-items:center;gap:10px;margin:6px 0 14px;font-size:22px;color:#d9cbb0}
.souls .skull{width:20px;height:18px;image-rendering:pixelated}

/* 标题屏 */
#titleScr{background:radial-gradient(ellipse at center, rgba(10,7,12,.55) 20%, rgba(4,3,6,.94) 90%)}
.t-title{font-size:74px;letter-spacing:.32em;color:#e8d9c0;transform:rotate(-1.2deg);text-shadow:0 0 24px rgba(255,138,30,.4),3px 3px 0 rgba(90,10,16,.8)}
.t-title span{display:inline-block}
.t-title span:nth-child(2){transform:translateY(6px)}
.t-title span:nth-child(3){transform:translateY(-4px) rotate(1deg)}
.t-title span:nth-child(4){transform:translateY(3px)}
.t-sub{font-size:20px;color:var(--org);letter-spacing:1.1em;margin:14px 0 6px;text-align:center}
.t-line{height:2px;width:300px;margin:14px auto;background:linear-gradient(90deg,transparent,rgba(255,138,30,.6),transparent)}
.t-ctrl{color:#7a7268;font-size:13px;letter-spacing:.12em;text-align:center;line-height:2}
.t-foot{color:#4d4742;font-size:12px;text-align:center;margin-top:22px;letter-spacing:.15em}
.t-quote{color:#b8a88e;font-size:16px;letter-spacing:.2em;text-align:center;margin-bottom:4px}
.t-flavor{color:#7a7268;font-size:13px;text-align:center;min-height:18px;margin-bottom:6px}
.flicker{animation:flick 4s steps(2) infinite}
@keyframes flick{0%,92%,100%{opacity:1}93%,95%{opacity:.55}94%{opacity:.8}}

#errbox{position:fixed;left:8px;bottom:8px;z-index:99;background:rgba(60,8,12,.9);color:#ffb0a0;font-size:12px;padding:4px 10px;display:none;max-width:70%}
</style>
</head>
<body>
<div id="stage"><canvas id="game" width="480" height="270"></canvas></div>
<div id="vign"></div>
<div id="dmgflash"></div>
<div id="healflash"></div>
<div id="whiteflash"></div>
<div id="scan"></div>
<div id="scanband"></div>

<div id="crosshair"><div class="cx cxh"></div><div class="cx cxv"></div><div class="cx cxd"></div></div>

<div class="hud" id="pTL">
  <div class="panel">
    <div class="tag">叛教者 <span class="sub">// APOSTATE</span></div>
    <div><span class="lbl">HP</span><span id="hpsegs"></span><span class="num" id="hpnum">100</span></div>
    <div id="xpbar"><i id="xpfill"></i></div>
    <div id="lvlrow">LV <b id="lvl">1</b><span id="lvlsub"></span></div>
    <div id="comborow" style="display:none">
      <span class="combolbl">COMBO</span><b id="combo">×0</b>
      <span id="combobar"><i id="combofill"></i></span>
    </div>
    <div id="grazerow">擦弹 <b id="graze">0</b> · 分 <b id="scoremid">0</b></div>
  </div>
</div>

<div class="hud" id="pTR">
  <canvas id="radar" width="48" height="48"></canvas>
  <div id="scorerow">分 <b id="score">0</b></div>
  <div id="soulrow">魂 <b id="souls">0</b></div>
  <div id="killrow">击杀 <span id="kills">0</span> · 最佳 第<span id="best">0</span>波</div>
</div>

<div class="hud" id="pTC">
  <div class="panel">
    <div id="wavetxt">WAVE <i id="waveno">0</i></div>
    <div id="hostile">敌意单位 <b id="hcount">0</b></div>
    <div id="bosshint"></div>
    <div id="calmtxt">—— 下一波 ——</div>
  </div>
</div>

<div class="hud" id="pBL">
  <div class="panel">
    <div id="wslots"></div>
    <div id="ammo"><span id="amnow">12</span><span class="res"> / <span id="ammax">12</span> · MAG</span></div>
    <div id="relwrap"><i id="relfill"></i></div>
    <div id="relhint">1-4 / 滚轮 换枪 · R 装填 · 空格 冲刺 · Q 圣餐</div>
  </div>
</div>

<div class="hud" id="pBR">
  <div class="piprow">冲刺 <span id="dashpips"></span></div>
  <div class="piprow">圣餐瓶 <span id="flaskpips"></span></div>
  <div class="piprow" style="color:#5a544e">TAB 强化 · M 静音 · ESC 暂停</div>
</div>

<div id="bossbar"><div id="bossname">主教 // BISHOP</div><div id="bbwrap"><i id="bbfill"></i></div></div>

<div id="banner"><div class="b1"></div><div class="bbar"></div><div class="b2"></div></div>
<div id="toast"></div>

function mkSprite(rows, pal){
  const w = rows[0].length, h = rows.length;
  const c = document.createElement('canvas'); c.width = w+2; c.height = h+2;
  const x = c.getContext('2d');
  const get=(ry,rx)=> ry<0||ry>=h||rx<0||rx>=rows[ry].length ? '.' : rows[ry][rx];
  // 描边
  x.fillStyle = OUTLINE;
  for(let ry=0;ry<h;ry++)for(let rx=0;rx<rows[ry].length;rx++){
    if(rows[ry][rx]==='.')continue;
    for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){
      if(get(ry+dy,rx+dx)==='.') x.fillRect(rx+1+dx, ry+1+dy, 1, 1);
    }
  }
  // 填色
  for(let ry=0;ry<h;ry++)for(let rx=0;rx<rows[ry].length;rx++){
    const ch = rows[ry][rx];
    if(ch!=='.' && pal[ch]){ x.fillStyle = pal[ch]; x.fillRect(rx+1, ry+1, 1, 1); }
  }
  return c;
}
function rot90(spr, k){
  if(k===0) return spr;
  const w=spr.width, h=spr.height;
  const c=document.createElement('canvas');
  c.width = k%2 ? h : w; c.height = k%2 ? w : h;
  const x=c.getContext('2d'); x.imageSmoothingEnabled=false;
  x.translate(c.width/2, c.height/2); x.rotate(k*Math.PI/2); x.drawImage(spr,-w/2,-h/2);
  return c;
}
function whiteOf(spr){
  const c=document.createElement('canvas'); c.width=spr.width; c.height=spr.height;
  const x=c.getContext('2d'); x.drawImage(spr,0,0);
  const d=x.getImageData(0,0,c.width,c.height);
  for(let i=3;i<d.data.length;i+=4){ if(d.data[i]>0){ d.data[i-3]=255;d.data[i-2]=255;d.data[i-1]=255; } }
  x.putImageData(d,0,0); return c;
}

/* ---------------- 音效（程序化合成） ---------------- */
const AU = {
  ctx:null, master:null, muted:false,
  init(){
    if(this.ctx) return;
    try{
      this.ctx = new (window.AudioContext||window.webkitAudioContext)();
      this.master = this.ctx.createGain(); this.master.gain.value = this.muted?0:G.meta.settings.vol;
      this.master.connect(this.ctx.destination);
      this.noiseBuf = this._mkNoise();
      startAmbient();
    }catch(e){}
  },
  _mkNoise(){
    const b = this.ctx.createBuffer(1, this.ctx.sampleRate*0.5, this.ctx.sampleRate);
    const d = b.getChannelData(0);
    for(let i=0;i<d.length;i++) d[i] = Math.random()*2-1;
    return b;
  },
  tone(o){
    if(!this.ctx) return;
    const t = this.ctx.currentTime + (o.at||0);
    const osc = this.ctx.createOscillator(), g = this.ctx.createGain();
    osc.type = o.type||'square';
    osc.frequency.setValueAtTime(o.f, t);
    if(o.slide) osc.frequency.exponentialRampToValueAtTime(Math.max(20,o.slide), t+(o.dur||.1));
    g.gain.setValueAtTime(o.vol||.1, t);
    g.gain.exponentialRampToValueAtTime(.0001, t+(o.dur||.1));
    osc.connect(g); g.connect(this.master);
    osc.start(t); osc.stop(t+(o.dur||.1)+.02);
  },
  noise(o){
    if(!this.ctx) return;
    const t = this.ctx.currentTime + (o.at||0);
    const src = this.ctx.createBufferSource(); src.buffer = this.noiseBuf;
    const g = this.ctx.createGain(), f = this.ctx.createBiquadFilter();
    f.type = o.lp?'lowpass':'highpass'; f.frequency.value = o.cut||1000;
    g.gain.setValueAtTime(o.vol||.1, t);
    g.gain.exponentialRampToValueAtTime(.0001, t+(o.dur||.1));
    src.connect(f); f.connect(g); g.connect(this.master);
    src.start(t); src.stop(t+(o.dur||.1)+.02);
  },
  bell(){
    this.tone({type:'sine',f:660,vol:.045,dur:1.8});
    this.tone({type:'sine',f:990.4,vol:.02,dur:1.4});
    this.tone({type:'sine',f:1320.8,vol:.008,dur:.9});
  }
};

    case 'combo': A.tone({f:520,vol:.07,dur:.08}); A.tone({f:780,at:.07,vol:.07,dur:.1}); break;
    case 'kick': A.tone({type:'sine',f:58,slide:36,vol:.07,dur:.1}); break;
  }
}
function sfxKill(){
  const A=AU; if(!A.ctx) return;
  const p=Math.min(G.combo,40);
  A.tone({f:210+p*9,slide:70,vol:.11,dur:.13});
  A.noise({lp:1,cut:620,vol:.13,dur:.1});
}
function startAmbient(){
  if(!AU.ctx || G.amb) return;
  G.amb = true;
  const o1 = AU.ctx.createOscillator(), o2 = AU.ctx.createOscillator();
  const g = AU.ctx.createGain(), f = AU.ctx.createBiquadFilter();
  o1.type='sawtooth'; o1.frequency.value=41; o2.type='sawtooth'; o2.frequency.value=41.7;
  f.type='lowpass'; f.frequency.value=180; g.gain.value=.035;
  o1.connect(f); o2.connect(f); f.connect(g); g.connect(AU.master);
  o1.start(); o2.start();
  // 低频脉动
  const lfo = AU.ctx.createOscillator(), lg = AU.ctx.createGain();
  lfo.frequency.value=.07; lg.gain.value=.018;
  lfo.connect(lg); lg.connect(g.gain); lfo.start();
}

function srPick(arr){ return arr[Math.floor(srnd()*arr.length)]; }
function todayStr(){ const d=new Date(); return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(); }
function dailySeed(){
  const s=todayStr(); let h=2166136261;
  for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619); }
  return h>>>0;
}

function makeObstacles(){
  G.ob = [];
  // 火盆（碰撞）
  [[64,46],[416,46],[64,224],[416,224]].forEach(p=>G.ob.push({x:p[0],y:p[1],r:7,kind:'braz'}));

  // 祭坛（矩形）
  G.ob.push({x:152,y:92,w:16,h:11,r:0,kind:'altar'});
  G.ob.push({x:330,y:184,w:16,h:11,r:0,kind:'altar'});

  G.ob.push({x:108,y:188,r:6,kind:'pillar'});
  G.ob.push({x:378,y:104,r:6,kind:'pillar'});
}
function free(x,y,r){
  if(x<r+6||x>W-r-6||y<r+6||y>H-r-6) return false;
  for(const o of G.ob){
    if(o.w){ // 矩形
      const dx=Math.max(Math.abs(x-o.x)-o.w/2,0), dy=Math.max(Math.abs(y-o.y)-o.h/2,0);
      if(dx*dx+dy*dy < (r+1)*(r+1)) return false;
    } else if(dist2(x,y,o.x,o.y) < (r+o.r)*(r+o.r)) return false;
  }
  return true;
}
function slideMove(ent,dx,dy){
  let nx=ent.x+dx, ny=ent.y+dy;
  if(free(nx,ny,ent.r)){ ent.x=nx; ent.y=ny; return; }
  if(free(nx,ent.y,ent.r)){ ent.x=nx; return; }
  if(free(ent.x,ny,ent.r)){ ent.y=ny; return; }
  // 卡住时向外推
  for(const o of G.ob){
    if(o.w) continue;
    const d=Math.hypot(ent.x-o.x,ent.y-o.y), need=ent.r+o.r;
    if(d<need&&d>0.01){ const push=(need-d)/d; ent.x+=(ent.x-o.x)*push; ent.y+=(ent.y-o.y)*push; }
  }
  ent.x=clamp(ent.x,8,W-8); ent.y=clamp(ent.y,8,H-8);
}
function line(x0,y0,x1,y1,color,thick){
  const n = Math.max(1, Math.ceil(Math.hypot(x1-x0,y1-y0))*2);
  ctx.fillStyle=color;
  for(let i=0;i<=n;i++){ const t=i/n; ctx.fillRect(Math.round(lerp(x0,x1,t))-(thick>>1), Math.round(lerp(y0,y1,t))-(thick>>1), thick, thick); }
}
function drawPentagram(x,y,r,color,thick){
  const pts=[];
  for(let i=0;i<5;i++){ const a=-Math.PI/2+i*TAU/5; pts.push([x+Math.cos(a)*r, y+Math.sin(a)*r]); }
  for(let i=0;i<5;i++){ const p1=pts[i], p2=pts[(i+2)%5]; line(p1[0],p1[1],p2[0],p2[1],color,thick); }
}
function buildFloor(){
  const c=document.createElement('canvas'); c.width=W; c.height=H;
  const x=c.getContext('2d');
  const rng = mulberry32(0xC0FFEE);
  x.fillStyle='#17141c'; x.fillRect(0,0,W,H);
  // 地砖
  const ts=8;
  for(let ty=0;ty<H/ts;ty++)for(let tx=0;tx<W/ts;tx++){
    const v=rng();
    if(v<.3){ x.fillStyle='#191521'; x.fillRect(tx*ts,ty*ts,ts,ts); }
    else if(v<.34){ x.fillStyle='#15121a'; x.fillRect(tx*ts,ty*ts,ts,ts); }
  }
  // 裂缝
  x.fillStyle='#0e0c12';
  for(let i=0;i<14;i++){
    let cx=rand(0,W), cy=rand(0,H), a=rand(0,TAU);
    const len=randi(8,26);
    for(let s=0;s<len;s++){ x.fillRect(Math.round(cx),Math.round(cy),1,1); cx+=Math.cos(a)*1.5; cy+=Math.sin(a)*1.5; a+=rand(-.6,.6); }
  }
  // 污渍
  for(let i=0;i<9;i++){
    let cx=rand(0,W), cy=rand(0,H); x.fillStyle=i%2?'#131019':'#1b1622';
    for(let s=0;s<10;s++){ x.fillRect(Math.round(cx+rand(-4,4)),Math.round(cy+rand(-4,4)),randi(2,5),randi(2,4)); cx+=rand(-6,6); cy+=rand(-6,6); }
  }
  // 各各他山：三座十字架（髑髅地）
  const cxs=[120,240,360];
  for(let i=0;i<3;i++){
    const cx2=cxs[i], cy2=58;
    x.fillStyle='#221018';
    x.fillRect(cx2-2,cy2-14,4,30);
    x.fillRect(cx2-11,cy2-10,22,4);
    x.fillStyle='#2b121c';
    x.fillRect(cx2-1,cy2-14,2,30);
  }
  // 髑髅地：散落的头骨
  x.drawImage(S.skull.spr, 231, 62);
  x.drawImage(S.skull.spr, 167, 71);
  x.drawImage(S.skull.spr, 311, 70);
  // 中央仪式圈
  const cx=W/2, cy=H/2;
  x.fillStyle='#1a0d12'; x.beginPath(); x.arc(cx,cy,66,0,TAU); x.fill();
  x.strokeStyle='#2b121c'; x.lineWidth=1; x.beginPath(); x.arc(cx,cy,66,0,TAU); x.stroke();
  x.strokeStyle='#221018'; x.beginPath(); x.arc(cx,cy,52,0,TAU); x.stroke();
  x.strokeStyle='#221018'; x.beginPath(); x.arc(cx,cy,20,0,TAU); x.stroke();
  const pts=[];
  for(let i=0;i<5;i++){ const a=-Math.PI/2+i*TAU/5; pts.push([cx+Math.cos(a)*52, cy+Math.sin(a)*52]); }
  x.strokeStyle='#33151f'; x.lineWidth=1;
  for(let i=0;i<5;i++){ const p1=pts[i], p2=pts[(i+2)%5];
    x.beginPath(); x.moveTo(p1[0],p1[1]); x.lineTo(p2[0],p2[1]); x.stroke(); }
  // 环绕符文
  for(let i=0;i<14;i++){
    const a=i/14*TAU, rx=cx+Math.cos(a)*74, ry=cy+Math.sin(a)*74;
    const kind = Math.floor(rng()*4);
    x.fillStyle = rng()<.5 ? '#4a1620' : '#3a1220';
    if(kind===0){ x.fillRect(rx-1,ry-2,1,4); x.fillRect(rx-2,ry-1,3,1); }
    else if(kind===1){ x.fillRect(rx-2,ry-2,4,1); x.fillRect(rx,ry-2,1,3); }
    else if(kind===2){ x.fillRect(rx-1,ry-1,2,2); x.fillRect(rx-3,ry-3,1,1); x.fillRect(rx+2,ry+2,1,1); }
    else { x.fillRect(rx-1,ry-2,1,4); }
  }
  // 血渍残留
  x.fillStyle='rgba(90,14,26,.5)';
  for(let i=0;i<7;i++){
    let bx=rand(20,W-20), by=rand(20,H-20);
    for(let s=0;s<6;s++){ x.fillRect(Math.round(bx),Math.round(by),randi(2,4),randi(1,3)); bx+=rand(-5,5); by+=rand(-4,4); }
  }
  // 边框
  x.fillStyle='#05040a'; x.fillRect(0,0,W,4); x.fillRect(0,H-4,W,4); x.fillRect(0,0,4,H); x.fillRect(W-4,0,4,H);

  G.decal = G.decalCv.getContext('2d');
  // 蜡烛

  const candPos=[[cx-40,cy-30],[cx+34,cy-26],[cx+30,cy+34],[cx-38,cy+30],[cx,cy+56],[cx,cy-56],[152,70],[330,206],[60,120],[420,150]];
  for(const p of candPos) G.cands.push({x:p[0],y:p[1],ph:rand(0,9)});
}

function availTypes(n){

  return 'zealot';
}

function startWave(n){
  G.wave=n; G.waveState='active'; G.toSpawn=[]; G.spawnT=.6;
  if(n>=5) giveAch('wave5');
  if(n>=10) giveAch('wave10');
  if(n>=15) giveAch('wave15');
  if(G.xpWavesLeft>0) G.xpWavesLeft--;
  const budget=Math.min(12+n*4, 80)*G.nextWaveMul; G.nextWaveMul=1;
  let left=budget;
  while(left>0){
    const ty=pickType(n); const cost=(ty==='gunner'||ty==='chanter')?2:1;
    if(cost>left){ left=0; break; }
    G.toSpawn.push(ty); left-=cost;
    if(G.toSpawn.length>80) break;
  }
  const boss = n%5===0;
  if(boss){
    G.toSpawn=G.toSpawn.slice(0,10); G.bossWave=true;
    G.bossPortaled=false;   // 修复：每一波 Boss 都要重新开启传送门
    const bossKey=['bishop','butcher','choir','madonna'][((Math.floor(n/5)-1)%4+4)%4];
    G.bossKey=bossKey;
    const bd=ETYPES[bossKey];
    banner(bd.name+' 降临','THE '+bd.en+' DESCENDS · 烛火在发抖');
    sfx('roar');
  } else {
    G.bossWave=false; G.bossKey=null;
    banner('第 '+n+' 波','WAVE '+n+' · '+(WAVE_SUBS[(n-1)%WAVE_SUBS.length]));
  }
  // 圣物箱（军火商：出现更频繁）
  const chestEvery=Math.max(5-shopLv('gunrunner'),3);
  if(!G.chest && n>=3 && (n-3)%chestEvery===0){
    const p=validSpawn(90); G.chest={x:p.x,y:p.y,opening:0,open:false};
    toast('圣物箱已出现。');
  }
  // 技能道具随处可见：每波开场掉落 1 个（场上最多 4 个）
  if(G.pickups.filter(p=>p.kind==='item').length<4){
    const ip=validSpawn(40);
    dropItem(ip.x,ip.y);
  }
}
function clearWave(){
  if(G.waveState==='clear') return;
  G.waveState='clear'; G.clearT=4;
  const bonus=5+G.wave;
  G.runSouls+=bonus;
  banner('肃清','CLEAR · 灵魂 +'+bonus);
  sfx('heart');
  if(G.wave>0 && G.wave%4===0){ G.pendingEvent=true; G.eventT=1.0; }
}
function upWaves(dt){
  if(G.waveState!=='active') return;
  const alive=G.enemies.length, maxAlive=Math.min(7+G.wave,36);
  // 生成队列
  if(G.toSpawn.length && alive<maxAlive){
    G.spawnT-=dt;
    if(G.spawnT<=0 && G.portals.length<Math.min(4+G.wave,12)){
      const ty=G.toSpawn.shift();
      const p=validSpawn(60);
      makePortal(p.x,p.y,ty,false);
      G.spawnT=Math.max(.38, 1.5-G.wave*.05);
    }
  }
  // Boss 降临传送门
  if(G.bossWave && G.toSpawn.length===0 && !G.boss && !G.bossPortaled){
    const p=validSpawn(90); makePortal(p.x,p.y,G.bossKey||'bishop',true); G.bossPortaled=true;
  }
  // 波次结束判定
  if(G.toSpawn.length===0 && G.portals.length===0 && alive===0){
    clearWave();
  }
}
function upPortals(dt){
  for(let i=G.portals.length-1;i>=0;i--){
    const p=G.portals[i]; p.t+=dt;
    if(p.t>=p.dur){
      G.portals.splice(i,1);
      const e=spawnEnemy(p.type,p.x,p.y);
      if(e.def.boss){ G.boss=e; showBossBar(true); shake(6); sfx('roar'); whiteFlash(); }
    }
  }
}

/* ---------------- 敌我子弹 ---------------- */
function eBullet(x,y,ang,sp,opts){
  opts=opts||{};
  if(G.ebullets.length>400) G.ebullets.splice(0,24);
  const s=sp*4/3*(1+Math.min(Math.max(G.wave-1,0)*.012,.25));   // 敌弹速度（原×2 后再 -33%），随波次成长
  G.ebullets.push({x,y,vx:Math.cos(ang)*s,vy:Math.sin(ang)*s,ang,sp:s,r:opts.r||2.5,dmg:(opts.dmg||8)*1.5,
    c:opts.c||'#ff5a2b',kind:opts.kind||'dot',t:0,f:opts.f||4,amp:opts.amp||14,ph:opts.ph||0,
    life:opts.life||6,turn:opts.turn||0,bx:x,by:y});
}
function pBullet(x,y,ang,sp,dmg,knock,pierce,crit,heavy,c,kind){
  kind=kind||'norm';
  G.pbullets.push({x,y,vx:Math.cos(ang)*sp,vy:Math.sin(ang)*sp,ang,r:heavy?3:2,dmg,knock,pierce,life:kind==='spray'?.3:(heavy?1.4:1.2),t:0,crit:!!crit,heavy:!!heavy,c:c||C.pbul,kind});
}
function segDist(px,py,x1,y1,x2,y2){
  const dx=x2-x1, dy=y2-y1;
  const l2=dx*dx+dy*dy||1;
  let t=((px-x1)*dx+(py-y1)*dy)/l2;
  t=clamp(t,0,1);
  return Math.hypot(px-(x1+t*dx),py-(y1+t*dy));
}
function rocketBoom(b){
  for(const o of G.enemies){ if(dist2(o.x,o.y,b.x,b.y)<28*28) damageEnemy(o,40,Math.atan2(o.y-b.y,o.x-b.x),5); }
  G.rings.push({x:b.x,y:b.y,r:2,max:16,life:.25,life0:.25,color:'#ff8a5a'});
  sparks(b.x,b.y,10,'#ff8a1e'); shake(2.5); sfx('boom'); whiteFlash(.06);
  bloodBurst(b.x,b.y,6,70);
}
function ring(x,y,n,sp,opts){
  opts=opts||{};
  if(opts.c) sparks(x,y,3,opts.c);   // 弹幕花心闪光
  for(let i=0;i<n;i++){ const a=i/n*TAU+(opts.off||0);
    eBullet(x,y,a,sp,{dmg:opts.dmg||8,r:opts.r||2.5,c:opts.c||'#c44bff',kind:opts.kind||'dot',ph:opts.ph||0,amp:opts.amp||0,f:0}); }
}
function aimed(x,y,sp,spread,dmg,c){
  const a=Math.atan2(P.y-y,P.x-x)+rand(-spread,spread);
  eBullet(x,y,a,sp,{dmg:dmg||8,c:c||'#ffb34d'});
  sfx('eshoot');
}
function upBullets(dt){
  for(let i=G.ebullets.length-1;i>=0;i--){
    const b=G.ebullets[i]; b.t+=dt; b.life-=dt;
    if(b.kind==='home'){   // 追踪弹
      const want=Math.atan2(P.y-b.y,P.x-b.x);
      let diff=want-b.ang;
      diff=Math.atan2(Math.sin(diff),Math.cos(diff));
      b.ang+=clamp(diff,-b.turn*dt,b.turn*dt);
      b.vx=Math.cos(b.ang)*b.sp; b.vy=Math.sin(b.ang)*b.sp;
    }
    b.bx+=b.vx*dt; b.by+=b.vy*dt;
    if(b.kind==='sine'){
      const px=-Math.sin(b.ang), py=Math.cos(b.ang);
      b.x=b.bx+px*Math.sin(b.t*b.f+b.ph)*b.amp;
      b.y=b.by+py*Math.sin(b.t*b.f+b.ph)*b.amp;
    } else { b.x=b.bx; b.y=b.by; }
    if(b.life<=0 || b.x<-8||b.x>W+8||b.y<-8||b.y>H+8){ G.ebullets.splice(i,1); continue; }
    if(!free(b.x,b.y,1)){ sparks(b.x,b.y,2,'#ff8a1e'); G.ebullets.splice(i,1); continue; }
    if(G.mode==='run' && !P.dead){
      const dd=dist2(b.x,b.y,P.x,P.y);
      if(P.invulnT<=0 && P.dashT<=0 && dd<(b.r+3)*(b.r+3)){
        damagePlayer(b.dmg);
        G.ebullets.splice(i,1);
      } else if(!b.grazed && dd<7.5*7.5 && P.invulnT<=0){
        // 擦弹：贴脸不死，奖你
        b.grazed=true; G.graze++; G.score++;
        mstat('graze',1);
        if(G.graze>=500) giveAch('graze500');
        if(P.stats.grazeHeal && G.grazeHealT<=0){ G.grazeHealT=.5; P.hp=Math.min(P.hpMax,P.hp+1); }
        sfx('graze');
        part(b.x,b.y,0,0,.18,'#7ae0ff',1,0);
      }
    }
  }
  if(G.grazeHealT>0) G.grazeHealT-=dt;
  for(let i=G.pbullets.length-1;i>=0;i--){
    const b=G.pbullets[i]; b.t+=dt; b.life-=dt;
    if(b.kind==='spray') b.vy+=320*dt;   // 圣水抛物线
    if(b.kind==='rocket'&&Math.random()<.4) part(b.x,b.y,rand(-6,6),rand(-6,6),.3,'#8a8494',1,0);  // 尾烟
    b.x+=b.vx*dt; b.y+=b.vy*dt;
    if(b.life<=0 || b.x<-8||b.x>W+8||b.y<-8||b.y>H+8){
      if(b.kind==='rocket') rocketBoom(b);
      G.pbullets.splice(i,1); continue;
    }
    if(!free(b.x,b.y,1)){
      sparks(b.x,b.y,2,'#ffd23f');
      if(b.kind==='rocket') rocketBoom(b);
      G.pbullets.splice(i,1); continue;
    }
    let hit=false, hitE=null;
    for(const e of G.enemies){
      if(dist2(b.x,b.y,e.x,e.y) < (b.r+e.r)*(b.r+e.r)){
        hitE=e;
        if(b.kind==='rocket'){ rocketBoom(b); hit=true; }
        else {
          damageEnemy(e,b.dmg,b.ang,b.knock,b.crit);
          if(b.pierce>0){ b.pierce--; } else { hit=true; }
        }
        break;
      }
    }
    if(hit){
      G.pbullets.splice(i,1);
      // 跳弹
      if(b.kind!=='rocket' && P.stats.ricochet>0 && Math.random()<P.stats.ricochet){
        let best=null, bd=1e9;
        for(const o of G.enemies){
          if(o===hitE) continue;
          const dd=dist2(b.x,b.y,o.x,o.y);
          if(dd<bd){ bd=dd; best=o; }
        }
        if(best){
          const a=Math.atan2(best.y-b.y,best.x-b.x);
          pBullet(b.x,b.y,a,280,b.dmg*.6,4,0,false);
          sparks(b.x,b.y,3,'#ffd23f');
        }
      }
    }
  }
}

/* ---------------- 玩家 ---------------- */
function playerDmg(crit,target){
  const w=P.weapon.def;
  let d=w.dmg*P.stats.dmg*(P.weapon.rare?1.3:1);
  if(P.stats.lowHp && P.hp<P.hpMax*.3) d*=1.4;
  if(P.hp<P.hpMax*.2) d*=1.25;                    // 濒死绝境
  if(P.stats.rage && P.rageT>0) d*=1.35;
  if(P.stats.adren && P.adrenT>0) d*=1.5;
  if(P.furyT>0) d*=1.5;   // 狂怒圣血
  if(G.combo>0) d*=1+Math.min(G.combo,50)*.01*P.stats.comboAmp;   // 连击狂热
  if(P.stats.exec && target && target.hp>=target.hpMax-.01) d*=1.5; // 处刑人
  if(crit) d*=2;
  return d;
}
function fireWeapon(){
  const w=P.weapon.def;
  if(P.swapT>0) return;
  if(P.ammo<=0){ startReload(true); if(!P.emptyTick||G.time-P.emptyTick>.3){ P.emptyTick=G.time; sfx('ui'); } return; }
  if(w.auto){ if(!G.fire) return; } else if(P.fireCd>0) return;
  P.fireCd=1/(w.rof*P.stats.rof*(P.furyT>0?1.3:1)*(P.chainT>0?1.3:1));
  P.ammo--; P.weapon.ammo=P.ammo;
  const pellets=w.pellets+P.stats.pellets;
  const knock=w.knock*P.stats.palisade;
  if(w.kind==='beam'){
    // 圣光加农：穿透光束
    const bx2=P.x+Math.cos(P.dir)*300, by2=P.y+Math.sin(P.dir)*300;
    G.beams.push({x1:P.x,y1:P.y,x2:bx2,y2:by2,life:.12,col:w.col||'#fff6d0'});
    for(const e of G.enemies){
      if(segDist(e.x,e.y,P.x,P.y,bx2,by2) < e.r+1.5){
        const crit=Math.random()<P.stats.crit;
        damageEnemy(e,playerDmg(crit),P.dir,knock,crit);
      }
    }
  } else {
    for(let i=0;i<pellets;i++){
      const off=(i-(pellets-1)/2)*w.spread;
      const a=P.dir+off+rand(-.012,.012);
      const sp=w.speed*(P.stats.bspeed||1);
      const crit=Math.random()<P.stats.crit;
      let bc=w.col||C.pbul;
      if(Math.random()<.3) bc=pick(PBUL_PAL);   // 30% 彩虹弹
      if(crit) bc='#ffffff';
      pBullet(P.x+Math.cos(P.dir)*6,P.y+Math.sin(P.dir)*6,a,sp,playerDmg(crit),knock,w.pierce+P.stats.pierce,crit,w.heavy,bc,w.kind);
    }
  }
  P.muzzle=.07; P.recoil=.05;
  G.shake=Math.max(G.shake,w.heavy?2.4:(w.light?.5:(w.en==='PENANCE SCATTER'?2.6:.9)));
  const ra=P.dir+Math.PI/2;
  for(let i=0;i<(w.en==='PENANCE SCATTER'?2:1);i++)
    part(P.x+Math.cos(P.dir)*8,P.y+Math.sin(P.dir)*8,Math.cos(ra)*rand(-14,14)+Math.cos(P.dir)*-20,Math.sin(ra)*rand(-10,10)+Math.sin(P.dir)*-20,.25,'#d8a33f',1,240); // 弹壳
  sfx(w.sfx);
  if(P.ammo<=0) startReload(true);
}
function startReload(auto){
  if(P.reloadT>0||P.ammo>=magSize()) return;
  P.reloadT=P.weapon.def.reload*P.stats.reload;
  sfx('reload');
}
function magSize(){ return Math.round(P.weapon.def.mag*P.stats.mag); }
function switchWeapon(i){
  if(i===P.wi || !P.slots[i] || P.dead) return;
  // 保存当前武器状态
  if(P.weapon){ P.weapon.ammo=P.ammo; P.weapon.reloadT=P.reloadT; }
  P.wi=i; P.weapon=P.slots[i];
  P.ammo=P.weapon.ammo; P.reloadT=P.weapon.reloadT; P.swapT=.22; P.muzzle=0;
  sfx('reload');
  G.hudc.wkey=undefined; G.hudc.wslots=undefined;
}
function cycleWeapon(dir){
  for(let k=1;k<=4;k++){
    const i=((P.wi+dir*k)%4+4)%4;
    if(P.slots[i]){ switchWeapon(i); return; }
  }
}
function doDash(){
  if(P.dashCd>0||P.dashCharges<=0||P.dead) return;
  const mx=(keys['KeyA']||keys['ArrowLeft'])?-1:((keys['KeyD']||keys['ArrowRight'])?1:0);
  const my=(keys['KeyW']||keys['ArrowUp'])?-1:((keys['KeyS']||keys['ArrowDown'])?1:0);
  let a;
  if(mx||my) a=Math.atan2(my,mx); else a=P.dir;
  P.dashA=a; P.dashT=.17; P.dashCd=.45*P.stats.dashCd; P.dashCharges--; P.invulnT=Math.max(P.invulnT,.22);
  if(P.stats.adren) P.adrenT=1.5;
  sfx('dash');
  for(let i=0;i<3;i++) G.ghosts.push({x:P.x,y:P.y,t:.12+i*.04,ang:P.dir});
}
function damagePlayer(d){
  if(P.invulnT>0||P.dashT>0||P.dead||G.mode!=='run') return;
  P.hp-=d; P.lastHit=G.time; P.invulnT=.75; P.rageT=P.stats.rage?4:0;
  G.shake=Math.max(G.shake,4.5);
  uiShake();
  flashDmg();
  bloodBurst(P.x,P.y,6,50);
  sfx('pdam');
  if(P.stats.revenge>0){
    for(let i=0;i<10;i++) pBullet(P.x,P.y,i/10*TAU,240,12*P.stats.revenge,4,0);
  }
  if(P.hp<=0) die();
}
function die(){
  if(P.stats.revive){
    P.stats.revive=false; P.hp=P.hpMax*.5; P.invulnT=3; P.revived=true;
    giveAch('revive');
    banner('第二口气','SECOND BREATH · 它替你死了一次');
    flashHeal(); sfx('revive'); shake(4);
    return;
  }
  P.dead=true; P.hp=0; G.dying=1.4; G.tsTarget=.22;
  bloodBurst(P.x,P.y,26,90); addDecalPool(P.x,P.y,10);
  sfx('boom'); shake(7);
}
function gainXp(v){
  G.xp += v*(1+Math.min(G.combo,20)*.01);   // 连击时经验加成：越杀升级越快
  while(G.xp>=G.need && !P.dead){
    G.xp-=G.need; G.level++;
    G.need=Math.floor(12+(G.level-1)*9+Math.pow(G.level-1,2)*1.4);
    // 每次晋升：伤害+3%、射速+1.5%、回血5 —— 你也在变强
    P.stats.dmg*=1.03; P.stats.rof*=1.015;
    P.hp=Math.min(P.hpMax,P.hp+5);
    floater(P.x,P.y-14,'晋升!','#ffd23f',8);
    sfx('heart');
    G.pendingLevels++;
  }
  if(G.pendingLevels>0 && G.mode==='run' && !P.dead) openLevelUp();
}
function useFlask(){
  if(P.flask<=0||P.hp>=P.hpMax) return;
  P.flask--; P.hp=Math.min(P.hpMax,P.hp+P.hpMax*(.4+.1*shopLv('alchemy')));
  flashHeal(); sfx('heart');
  floater(P.x,P.y-8,'+'+Math.round(P.hpMax*(.4+.1*shopLv('alchemy'))),'#5fd47c',7);
}
function equipWeapon(wtype,rare){
  const def=WEAPONS[wtype];
  // 已有同款
  for(let i=0;i<4;i++){
    const s=P.slots[i];
    if(s && s.def===def){
      if(rare) s.rare=true;
      s.ammo=magSizeFor(def);
      if(i===P.wi){ P.ammo=s.ammo; }
      G.runSouls+=20;
      toast('重复武器，弹匣补满，灵魂 +20'); sfx('pickup');
      G.hudc.wslots=undefined;
      return;
    }
  }
  // 空槽位
  for(let i=0;i<4;i++){
    if(!P.slots[i]){
      P.slots[i]={def,rare,ammo:magSizeFor(def),reloadT:0};
      switchWeapon(i);
      banner((rare?'「祝圣」':'')+def.name,def.en+(rare?' · CONSECRATED':'')+' · 到手');
      sfx('level');
      mstat('weaponsFound',1);
      if(P.slots.filter(Boolean).length===4) giveAch('arsenal');
      G.hudc.wslots=undefined;
      return;
    }
  }
  // 满员：替换当前武器
  const cur=P.wi;
  P.slots[cur]={def,rare,ammo:magSizeFor(def),reloadT:0};
  P.weapon=P.slots[cur]; P.ammo=P.slots[cur].ammo; P.reloadT=0;
  banner((rare?'「祝圣」':'')+def.name,def.en+(rare?' · CONSECRATED':'')+' · 替换当前武器');
  sfx('level');
  mstat('weaponsFound',1);
  G.hudc.wslots=undefined; G.hudc.wkey=undefined;
}
function magSizeFor(def){ return Math.round(def.mag*P.stats.mag); }
function upPlayer(dt){
  if(P.dead||G.mode!=='run') return;
  // 移动
  let mx=(keys['KeyA']||keys['ArrowLeft'])?-1:((keys['KeyD']||keys['ArrowRight'])?1:0);
  let my=(keys['KeyW']||keys['ArrowUp'])?-1:((keys['KeyS']||keys['ArrowDown'])?1:0);
  const sp=74*P.stats.speed;
  // 濒死绝境 +10%、嗜血 +20%
  const lowSpd = (P.hp<P.hpMax*.2?1.1:1)*(P.lustT>0?1.2:1);
  if(P.dashT>0){
    P.dashT-=dt;
    slideMove(P,Math.cos(P.dashA)*340*dt,Math.sin(P.dashA)*340*dt);
    P.invulnT=Math.max(P.invulnT,.03);
  } else {
    if(mx||my){ const l=Math.hypot(mx,my); slideMove(P,mx/l*sp*lowSpd*dt,my/l*sp*lowSpd*dt); }
  }
  P.dashCd-=dt; P.invulnT-=dt; P.rageT-=dt; P.fireCd-=dt; P.muzzle=(P.muzzle||0)-dt;
  P.recoil=Math.max(0,(P.recoil||0)-dt*.8);
  P.swapT-=dt; P.adrenT-=dt; P.lustT-=dt; P.chainT-=dt; P.furyT-=dt; P.shieldT-=dt;
  if(P.dashCd<=0){
    // 冲刺充能回复：冷却转完即回 1 格（BUG 修复：此前充能从未恢复）
    if(P.dashCharges<P.dashMax){
      P.dashCharges++;
      P.dashCd=P.dashCharges<P.dashMax?.45*P.stats.dashCd:0;
    } else P.dashCd=0;
  }
  // 瞄准
  P.dir=Math.atan2(G.my-P.y,G.mx-P.x);
  // 射击
  if(G.fire) fireWeapon();
  // 装填
  if(P.reloadT>0){ P.reloadT-=dt;
    if(P.reloadT<=0){
      P.reloadT=0; P.ammo=magSize(); P.weapon.ammo=P.ammo;
      sfx('reload_done'); shake(.8);
      if(P.stats.kata){  // 枪斗术：换弹即反击
        for(let i=0;i<8;i++) pBullet(P.x,P.y,i/8*TAU+P.dir,260,playerDmg()*.5,4,0);
        whiteFlash(.15); sfx('shoot_sh');
      }
    }
  }
  // 处决标记
  if(P.stats.mark){
    P.markT-=dt;
    if(P.markT<=0){
      P.markT=6;
      const pool=G.enemies.filter(e=>!e.marked);
      if(pool.length){ const e=pick(pool); e.marked=true; sfx('combo'); floater(e.x,e.y-10,'标记','#ff4b5c',7); }
    }
  }
  // 脱战回复
  if(G.time-P.lastHit>4 && P.hp<P.hpMax){ P.hp=Math.min(P.hpMax,P.hp+4*dt); }
  // 圣餐杯
  if(P.stats.regen>0){ P.regenT+=dt; if(P.regenT>=3){ P.regenT=0; P.hp=Math.min(P.hpMax,P.hp+P.stats.regen); } }
  // 天罚
  if(P.stats.bolt>0){
    P.boltT-=dt;
    if(P.boltT<=0){
      P.boltT=P.stats.bolt;
      if(G.enemies.length){ const e=pick(G.enemies); G.bolt={x:e.x,y:e.y-4,t:.3}; sfx('bolt'); shake(3); }
    }
  }
  if(G.bolt){
    G.bolt.t-=dt; G.bolt.xt=G.bolt.xt||0;
    if(G.bolt.t<=0){
      const b=G.bolt;
      for(const e of G.enemies){ if(dist2(b.x,b.y,e.x,e.y)<16*16){ damageEnemy(e,40+ G.level*2 +playerDmg()*.5,0,3); } }
      sparks(b.x,b.y,14,'#fff6d0'); bloodBurst(b.x,b.y,8,70); shake(3);
      G.bolt=null;
    }
  }
  // 荆棘光环（脉冲结算，避免逐帧音效与粒子刷屏）
  if(P.stats.thorns>0){
    P.thornT=(P.thornT||0)-dt;
    if(P.thornT<=0){
      P.thornT=.5;
      for(const e of G.enemies){
        if(dist2(e.x,e.y,P.x,P.y)<(e.r+14)*(e.r+14)) damageEnemy(e,P.stats.thorns*.5,0,0);
      }
    }
  }
  // 心跳与低血脉冲
  const lowHP=P.hp<P.hpMax*.3;
  if(lowHP&&!P.dead){
    G.hbT-=dt;
    if(G.hbT<=0){ G.hbT=.9; sfx('thump'); }
    if(!G.lowPulse){ G.lowPulse=true; $('dmgflash').style.opacity=.16; }
    else if(G.time>(G.lastFlash||0)+.25){ $('dmgflash').style.opacity=.16; }
  } else if(G.lowPulse){
    G.lowPulse=false;
    if($('dmgflash').style.opacity!=='1') $('dmgflash').style.opacity=0;
  }
}
function comboMilestone(n){

  if(G.combo>=60) giveAch('combo60');
}
function onKill(e){

  G.combo++; G.comboT=2.5;

  G.score += 10 + cmb*2;
  const dailyMul=G.daily?1.5:1;
  G.runSouls += Math.ceil(e.def.soul*(1+shopLv('greed')*.1)*(1+Math.min(cmb,30)*.02)*dailyMul) + P.stats.soulForge;
  if(P.stats.chain) P.chainT=3;
  if(P.stats.bloodlust) P.lustT=1.5;
  if(cmb>=5 && cmb%5===0) comboMilestone(cmb);
  P.hp=Math.min(P.hpMax,P.hp+P.stats.lifesteal);
  // 血肉盛宴：0.6 秒内 3 杀
  if(G.time-G.lastKillT<.6){ G.carnCount++; } else { G.carnCount=1; }
  G.lastKillT=G.time;
  if(G.carnCount>=3){
    G.carnCount=0; G.hitstop=.06; G.runSouls+=5; shake(3.5);

  // 魂火飞向玩家（正反馈视觉）
  for(let i=0;i<2;i++){
    const a=Math.atan2(P.y-e.y,P.x-e.x)+rand(-.5,.5);

  }
  if(P.stats.explodeCh>0 && Math.random()<P.stats.explodeCh){
    for(const o of G.enemies){ if(o!==e && dist2(o.x,o.y,e.x,e.y)<28*28) damageEnemy(o,45+G.level*2,0,4); }
    sparks(e.x,e.y,12,'#ff8a1e'); shake(2.5); sfx('boom');
  }

    G.rings.push({x:e.x,y:e.y,r:4,max:44,life:.4,life0:.4,color:'#ff5a2b'});
    // 军火商：满级必掉两把武器；赏金：Boss 灵魂加成

      G.pickups.push({kind:'weapon',x:e.x+rand(-8,8),y:e.y+rand(-8,8),t:30,wtype:ws,rare:srnd()<.18});
    }
    G.runSouls += Math.round(e.def.soul*.2*shopLv('bounty'));

      G.pickups.push({kind:'heart',x:e.x,y:e.y,t:25});

function damageEnemy(e,d,ang,knock,crit){
  if(!e||e.hp<=0) return;
  if(P.stats.exec && e.hp>=e.hpMax-.01) d*=1.5;
  if(P.stats.hunter>1 && (e.def.boss||e.type==='idol')) d*=P.stats.hunter;
  if(e.marked) d*=2;
  e._lastCrit=!!crit;
  e.hp-=d;
  if(ang!==0||knock) { e.kx+=Math.cos(ang)*knock*2; e.ky+=Math.sin(ang)*knock*2; }
  if(d>=1){
    e.flash=.12;
    if(ang!==0) e._hitAng=ang;
    bloodBurst(e.x,e.y,4,65,ang,.8);           // 定向喷血
    if(ang!==0) sparks(e.x,e.y,2,'#ffd23f');   // 命中火花
    sfx('ehit');
    G.crossHitT=.08;                            // 准星命中红闪
    shake(Math.max(G.shake,.5));                // 每次击打屏幕微震
    floater(e.x,e.y-6,Math.round(d),crit?'#ffb34d':'#fff',crit?10:8);
    if(crit){
      whiteFlash(.06); sfx('thump');
      G.hitstop=Math.max(G.hitstop,.015);       // 暴击定格
    }
  }
  if(e.hp<=0) killEnemy(e);
}
function killEnemy(e,noBoom){
  if(e.dead) return;
  e.dead=true;
  const i=G.enemies.indexOf(e); if(i>=0) G.enemies.splice(i,1);
  if(e.ai==='boom' && !noBoom) blastEffects(e);
  const crit=e._lastCrit;
  // 血腥：沿弹道定向喷血 + 体素残肢 + 内脏留地 + 冲击波 + 定格
  bloodBurst(e.x,e.y,e.def.boss?34:(crit?18:12),95,e._hitAng,.9);
  addDecal(e.x,e.y,e.def.boss?8:(crit?5:3),e.def.boss);
  spawnGibs(e.x,e.y,e.def.boss?10:(crit?4:2),e.def.boss?130:85);
  if(Math.random()<.35 && !e.def.boss){   // 内脏盘绕留在地上
    const d=G.decal; let px=e.x, py=e.y;
    d.fillStyle='#8a3a4a';
    for(let s=0;s<7;s++){ d.fillRect(Math.round(px),Math.round(py),2,2); px+=rand(-4,4); py+=rand(-3,3); }
  }
  G.rings.push({x:e.x,y:e.y,r:2,max:crit?16:12,life:crit?.28:.22,life0:crit?.28:.22,color:crit?'#ff5a2b':'#ff8a1e'});
  if(!e.def.boss) G.hitstop=Math.max(G.hitstop,.02);
  sfxKill();
  onKill(e);
}
function blastEffects(e){
  ring(e.x,e.y,12,58,{dmg:e.dmg,r:3,c:'#ff5a2b'});
  for(const o of G.enemies){ if(o!==e && dist2(o.x,o.y,e.x,e.y)<26*26) damageEnemy(o,30,Math.atan2(o.y-e.y,o.x-e.x),5); }

function explode(e){

function bossPhase(e){
  const ratio=e.hp/e.hpMax;
  const nph=ratio>.66?1:(ratio>.33?2:3);
  if(!e.phase) e.phase=1;
  if(nph!==e.phase){
    e.phase=nph;
    banner('第'+(nph===2?'二':'三')+'阶段','PHASE '+nph+' · '+e.def.name+' 暴怒了');

    uiShake();
    ring(e.x,e.y,8,42,{dmg:6,c:'#ffd23f',r:2.5});
  }
  return nph;
}
