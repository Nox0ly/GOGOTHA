    case 'idol':{
      e.wt-=dt;
      if(e.wt<=0){ e.wt=rand(1.5,3); const a=rand(0,TAU); e.wx=clamp(e.x+Math.cos(a)*rand(30,70),16,W-16); e.wy=clamp(e.y+Math.sin(a)*rand(30,70),16,H-16); }
      const wd=Math.hypot(e.wx-e.x,e.wy-e.y);
      if(wd>3){ mvx=(e.wx-e.x)/wd*e.speed; mvy=(e.wy-e.y)/wd*e.speed; }
      e.face=faceIndex(Math.atan2(dy,dx));
      e.spirT-=adt;
      if(e.spirT<=0){ e.spirT=.13; e.spA=(e.spA||0)+.38;
        eBullet(e.x,e.y,e.spA,46,{dmg:e.dmg,c:'#8dff5a',r:2.5});
        eBullet(e.x,e.y,e.spA+Math.PI,46,{dmg:e.dmg,c:'#8dff5a',r:2.5}); }
      e.homT-=adt;
      if(e.homT<=0){ e.homT=5.5;
        const n=G.wave>=10?4:3;
        for(let i=0;i<n;i++) eBullet(e.x,e.y,rand(0,TAU),26,{dmg:e.dmg*.9,c:'#8dff5a',kind:'home',turn:1.5,life:5,r:3});
        sfx('eshoot');
      }
      if(e.flash>0 && Math.random()<.5){   // 受伤闪避传送
        e.flash=0;
        const p=validSpawn(70); e.x=p.x; e.y=p.y;
        sparks(e.x,e.y,10,'#8dff5a'); sfx('dash');
      }
      break;}
    case 'boom':{
      mvx=dx/d*e.speed; mvy=dy/d*e.speed;
      if(d<20&&e.fuseT<0){ e.fuseT=.45; }
      if(e.fuseT>0){ e.fuseT-=dt; mvx=0; mvy=0;
        if(e.fuseT<=0) explode(e); }
      break;}
    case 'brute':{
      e.slamT-=adt; e.chargeT-=adt;
      if(e.charging>0){
        e.charging-=dt;
        mvx=Math.cos(e.chA)*130; mvy=Math.sin(e.chA)*130;
        if(e.charging<=0){ e.charging=0; e.kx=0; e.ky=0; }
      } else {
        if(e.chargeT<=0 && d>70 && d<180){
          e.chargeT=3.2; e.chA=Math.atan2(dy,dx); e.charging=.55;
        } else if(e.slamT<=0 && d<46){
          e.slamT=3.6; e.stunT=.6; e.slamPulse=0.7;
        } else { mvx=dx/d*e.speed; mvy=dy/d*e.speed; }
      }
      if(e.slamPulse>0){ e.slamPulse-=dt;
        if(e.slamPulse<=0){ ring(e.x,e.y,8,44,{dmg:12,c:'#ff5a2b',r:3}); sfx('boom'); shake(2.5); } }
      break;}
    case 'bishop':{
      // 保持距离 + 缓慢绕行
      if(d>120){ mvx=dx/d*e.speed; mvy=dy/d*e.speed; }
      else if(d<80){ mvx=-dx/d*e.speed*.5; mvy=-dy/d*e.speed*.5; }
      else { e.strafeT-=dt; if(e.strafeT<=0){ e.strafeT=rand(1.2,2); e.strafe*=-1; }
        mvx=(-dy/d)*e.speed*.4*e.strafe; mvy=(dx/d)*e.speed*.4*e.strafe; }
      e.face=faceIndex(Math.atan2(dy,dx));
      bossPhase(e);
      const ph = e.hp/e.hpMax;
      e.ringT-=adt; e.aimT-=adt; e.spiralT+=adt;
      if(e.ringT<=0){
        e.ringT = ph>.66?1.5:1.05;
        ring(e.x,e.y,16+G.wave*1.2,Math.min(48+G.wave*1.6,68),{dmg:e.dmg*.8,c:'#ff5a2b',off:e.t});
        sfx('eshoot');
      }
      if(e.aimT<=0){
        e.aimT=2.3;
        for(let i=0;i<5;i++) aimed(e.x,e.y,55+Math.min(G.wave,20)*.9,.28,e.dmg,'#ffb34d');
      }
      if(ph<=.66){
        if(e.spiralT>.09){ e.spiralT=0; e.spiralA=(e.spiralA||0)+.31;
          eBullet(e.x,e.y,e.spiralA,48,{dmg:e.dmg*.7,c:'#c44bff',r:3});
          eBullet(e.x,e.y,e.spiralA+Math.PI,48,{dmg:e.dmg*.7,c:'#c44bff',r:3}); }
      }
      if(ph<=.33){
        e.summonT-=adt;
        if(e.summonT<=0){ e.summonT=4.5;
          for(let i=0;i<2;i++){ const p=validSpawn(60); makePortal(p.x,p.y,'zealot',false); }
          sfx('roar');
        }
      }
      break;}
    case 'butcher':{
      // 纯远程血炮：保持距离 + 血色新星 + 掷弹 + 瞄准扇面
      const ph=bossPhase(e);
      if(d>180){ mvx=dx/d*e.speed*.7; mvy=dy/d*e.speed*.7; }
      else if(d<110){ mvx=-dx/d*e.speed*.6; mvy=-dy/d*e.speed*.6; }
      else { e.strafeT-=dt; if(e.strafeT<=0){ e.strafeT=rand(1,2); e.strafe*=-1; }
        mvx=(-dy/d)*e.speed*.45*e.strafe; mvy=(dx/d)*e.speed*.45*e.strafe; }
      e.face=faceIndex(Math.atan2(dy,dx));
      e.novaT-=adt; e.aimT-=adt;
      if(e.novaT<=0){
        e.novaT=ph>=3?2.1:2.9;
        ring(e.x,e.y,ph>=3?18:14,50,{dmg:e.dmg,c:'#ff2b3a',r:3});
        const nl=ph>=2?4:3;
        for(let i=0;i<nl;i++) lobBomb(e.x,e.y,P.x+rand(-30,30),P.y+rand(-30,30));
        sfx('boom');
      }
      if(e.aimT<=0){
        e.aimT=1.5;
        for(let i=0;i<(ph>=3?7:5);i++) aimed(e.x,e.y,60,.3,e.dmg,'#ff5a2b');
      }
      break;}
    case 'choir':{
      const ph=bossPhase(e);
      if(d>170){ mvx=dx/d*e.speed; mvy=dy/d*e.speed; }
      else if(d<110){ mvx=-dx/d*e.speed; mvy=-dy/d*e.speed; }
      else { e.strafeT-=dt; if(e.strafeT<=0){ e.strafeT=rand(1,2); e.strafe*=-1; }
        mvx=(-dy/d)*e.speed*.4*e.strafe; mvy=(dx/d)*e.speed*.4*e.strafe; }
      e.face=faceIndex(Math.atan2(dy,dx));
      if(e.streaming){
        e.streamT-=dt;
        e.armA+=(ph>=3?1.45:.95)*adt;
        e.emitT-=adt;
        const arms=ph>=2?2:1;
        if(e.emitT<=0){ e.emitT=.06;
          for(let i=0;i<arms;i++) eBullet(e.x,e.y,e.armA+i*Math.PI,56,{dmg:e.dmg,c:'#ffd23f',r:2.5}); }
        if(e.streamT<=0){ e.streaming=false; e.cycT=1.1; e.fanN=2; }
      } else {
        e.cycT-=adt;
        if(e.cycT<=0){ e.streaming=true; e.streamT=2.5; e.armA=rand(0,TAU); }
        if(e.fanN>0){ e.fanT-=adt;
          if(e.fanT<=0){ e.fanT=.45; e.fanN--;
            for(let i=0;i<6;i++) aimed(e.x,e.y,62,.34,e.dmg,'#ffe9a8'); } }
      }
      if(ph>=3 && !e.summoned){ e.summoned=true;
        for(let i=0;i<2;i++){ const p=validSpawn(60); makePortal(p.x,p.y,'gunner',false); }
        sfx('roar');
      }
      break;}
    case 'madonna':{
      const ph=bossPhase(e);
      mvx=(W/2-e.x)*.03; mvy=(H/2-e.y)*.03;
      e.face=faceIndex(Math.atan2(dy,dx));
      e.ringT-=adt; e.spirT-=adt; e.wispT-=adt;
      if(e.ringT<=0){
        e.ringT=ph>=3?2:2.6;
        for(let i=0;i<28;i++){ if(i%7===0) continue;   // 4 个缺口可钻
          eBullet(e.x,e.y,i/28*TAU+e.t*.2,ph>=3?54:48,{dmg:e.dmg,c:'#c44bff',r:2.5}); }
        sfx('eshoot');
      }
      if(e.spirT<=0){ e.spirT=.1; e.spA=(e.spA||0)+.25;
        const arms=ph>=2?4:2;
        for(let i=0;i<arms;i++) eBullet(e.x,e.y,e.spA+i*TAU/arms,46,{dmg:e.dmg*.9,c:'#e5a5ff',r:3}); }
      if(e.wispT<=0){
        e.wispT=2.4;
        for(let i=0;i<4;i++){ const a=G.time*1.2+i*TAU/4;
          const wx=e.x+Math.cos(a)*26, wy=e.y+Math.sin(a)*26;
          aimed(wx,wy,60,.05,6,'#ffe9a8'); }
      }
      break;}
  }
  if(!['gunner','knifer','arbalester','hexer','chanter','lobber','warden','idol','bishop','butcher','choir','madonna'].includes(e.ai)) e.face=faceIndex(Math.atan2(mvy||dy,mvx||dx));
  slideMove(e,(mvx+e.kx)*dt,(mvy+e.ky)*dt);
  // 接触伤害
  if(e.cdmg>0 && e.contactT<=0 && d<e.r+4){
    damagePlayer(e.cdmg);
    e.contactT=.8;
  }
}

/* ---------------- 拾取 ---------------- */
function spawnGem(x,y,v){
  let tier='gemC';
  if(v>=20) tier='gemY'; else if(v>=10) tier='gemP'; else if(v>=5) tier='gemG';
  G.gems.push({x:x+rand(-3,3),y:y+rand(-3,3),v:v*(G.xpWavesLeft>0?1.5:1),tier,t:0});
}
function upPickups(dt){
  for(let i=G.gems.length-1;i>=0;i--){
    const g=G.gems[i]; g.t+=dt;
    const d=Math.hypot(P.x-g.x,P.y-g.y);
    if(d<P.stats.magnet && G.mode==='run'){
      const sp=Math.min(160,(P.stats.magnet-d)*4+60);
      g.x+=Math.cos(Math.atan2(P.y-g.y,P.x-g.x))*sp*dt;
      g.y+=Math.sin(Math.atan2(P.y-g.y,P.x-g.x))*sp*dt;
    }
    if(d<7&&G.mode==='run'){
      G.gems.splice(i,1); gainXp(g.v); sfx('gem');
      part(g.x,g.y,0,-20,.25,g.tier==='gemY'?'#ffd23f':g.tier==='gemP'?'#c44bff':g.tier==='gemG'?'#4dff88':'#7ae0ff',1,0);
    }
  }
  for(let i=G.pickups.length-1;i>=0;i--){
    const p=G.pickups[i]; p.t-=dt;
    if(p.t<=0){ G.pickups.splice(i,1); continue; }
    if(G.mode!=='run') continue;
    const d=Math.hypot(P.x-p.x,P.y-p.y);
    if(p.kind==='heart'&&d<8){ P.hp=Math.min(P.hpMax,P.hp+18); flashHeal(); sfx('heart'); floater(P.x,P.y-8,'+18','#ff6a7a',7); G.pickups.splice(i,1); }
    else if(p.kind==='weapon'&&d<9){ equipWeapon(p.wtype,p.rare); G.pickups.splice(i,1); }
    else if(p.kind==='item'&&d<9){ applyItem(p.type); G.pickups.splice(i,1); }
  }
  if(G.chest&&!G.chest.open&&G.mode==='run'){
    const d=Math.hypot(P.x-G.chest.x,P.y-G.chest.y);
    if(d<12){ G.chest.open=true;
      const w=srPick(Object.keys(WEAPONS));
      G.pickups.push({kind:'weapon',x:G.chest.x,y:G.chest.y-6,t:30,wtype:w,rare:srnd()<.15});
      for(let i=0;i<5;i++) spawnGem(G.chest.x+rand(-8,8),G.chest.y+rand(-8,8),5);
      dropItem(G.chest.x,G.chest.y+6);   // 圣物箱附带技能道具 ×2
      dropItem(G.chest.x+6,G.chest.y);
      sparks(G.chest.x,G.chest.y,10,'#ffd23f'); sfx('level');
    }
  }
}

/* ---------------- 渲染 ---------------- */
function drawEntity(e){
  const key=(e.def&&e.def.spr)||e.type;
  const sp = S[key] || S.cultist;   // 兜底：未知敌人绝不崩溃
  const anim2 = e.ai==='boom'&&e.fuseT>0 ? (Math.floor(G.time*16)%2===0) : false;
  let spr = sp.rot[e.face||0] || sp.spr;
  if(anim2 && sp.rot2) spr = sp.rot2[e.face||0];
  // 悬空圣像：上下悬浮
  const bob = e.type==='idol' ? Math.sin(G.time*3+e.seed)*2 : 0;
  ctx.drawImage(spr, Math.round(e.x-spr.width/2), Math.round(e.y-spr.height/2+bob));
  if(e.flash>0){
    ctx.globalAlpha=clamp(e.flash*6,0,1);
    ctx.drawImage(anim2&&sp.white2?sp.white2:sp.white, Math.round(e.x-spr.width/2), Math.round(e.y-spr.height/2+bob));
    ctx.globalAlpha=1;
  }
  // 主教：帽冠 + 光环
  if(e.type==='bishop'){
    ctx.fillStyle='#c9a13f';
    ctx.fillRect(e.x-3,e.y-9,7,1); ctx.fillRect(e.x-2,e.y-12,5,1); ctx.fillRect(e.x-1,e.y-14,3,1);
    ctx.fillStyle='#ff4b2e'; ctx.fillRect(e.x-1,e.y-10,2,2);
    const rr=15;
    ctx.fillStyle='#c44bff';
    for(let i=0;i<6;i++){ const a=G.time*1.5+i/6*TAU; ctx.fillRect(Math.round(e.x+Math.cos(a)*rr)-1,Math.round(e.y+Math.sin(a)*rr)-1,2,2); }
  }
  // 屠夫：滴血砍刀 + 冲锋红光
  if(e.type==='butcher'){
    ctx.fillStyle='#8a94a0';
    ctx.fillRect(e.x-8,e.y-4,2,6); ctx.fillRect(e.x-10,e.y-3,4,3);
    ctx.fillStyle=C.blood; ctx.fillRect(e.x-9,e.y+2,1,1);
    if(e.charging>0){
      ctx.fillStyle=Math.floor(G.time*14)%2?'#fff6d0':'#ff2b3a';
      ctx.fillRect(e.x-5,e.y-6,10,3);
    }
  }
  // 唱诗班：金色高帽 + 光晕
  if(e.type==='choir'){
    ctx.fillStyle='#c9a13f';
    ctx.fillRect(e.x-2,e.y-9,5,1); ctx.fillRect(e.x-1,e.y-11,3,1); ctx.fillRect(e.x,e.y-13,1,1);
    ctx.fillStyle='rgba(255,210,63,.14)';
    ctx.beginPath(); ctx.arc(e.x,e.y,13+Math.sin(G.time*3)*1.5,0,TAU); ctx.fill();
  }
  // 圣母：光环 + 圣婴卫星
  if(e.type==='madonna'){
    ctx.strokeStyle='rgba(255,210,63,.5)';
    ctx.beginPath(); ctx.arc(e.x,e.y-5,7,0,TAU); ctx.stroke();
    for(let i=0;i<4;i++){
      const a=G.time*1.2+i*TAU/4;
      const wx=e.x+Math.cos(a)*26, wy=e.y+Math.sin(a)*26;
      ctx.fillStyle='#ffe9a8';
      ctx.fillRect(Math.round(wx)-1,Math.round(wy)-1,3,3);
      ctx.fillStyle='#ff8a1e'; ctx.fillRect(Math.round(wx),Math.round(wy),1,1);
    }
  }
  // 圣像：绿光晕
  if(e.type==='idol'){
    ctx.fillStyle='rgba(141,255,90,.13)';
    ctx.beginPath(); ctx.arc(e.x,e.y-4+bob,9+Math.sin(G.time*4)*1.5,0,TAU); ctx.fill();
  }
  // 弩手：红色预瞄线
  if(e.ai==='arbalester'&&e.lineT>0){
    const a=Math.floor(G.time*20)%2;
    ctx.strokeStyle=a?'rgba(255,60,50,.75)':'rgba(255,60,50,.35)';
    ctx.lineWidth=1;
    ctx.beginPath();
    ctx.moveTo(e.x+Math.cos(e.lineA)*8,e.y+Math.sin(e.lineA)*8);
    ctx.lineTo(e.x+Math.cos(e.lineA)*280,e.y+Math.sin(e.lineA)*280);
    ctx.stroke();
  }
  // 咒师：施法绿光
  if(e.fireT>0){ ctx.fillStyle='rgba(141,255,90,.5)'; ctx.fillRect(e.x-3,e.y-8,6,3); }
  // 蓄力 / 引信 闪光
  if(e.ai==='boom'&&e.fuseT>0){ ctx.fillStyle=Math.floor(G.time*14)%2?'#fff':'#ff5a2b'; ctx.fillRect(e.x-3,e.y-5,6,6); }
  if(e.ai==='brute'&&e.charging>0){ ctx.fillStyle=Math.floor(G.time*14)%2?'#fff6d0':'#ff5a2b'; ctx.fillRect(e.x-4,e.y-3,8,3); }
  if(e.ai==='brute'&&e.slamPulse>0){ const pr=12*(1-e.slamPulse/.7); ctx.strokeStyle='rgba(255,90,43,.7)'; ctx.beginPath(); ctx.arc(e.x,e.y,pr,0,TAU); ctx.stroke(); }
  if(e.ai==='warden'){ // 符文环
    ctx.strokeStyle='rgba(122,224,255,.35)';
    ctx.beginPath(); ctx.arc(e.x,e.y,9,0,TAU); ctx.stroke();
    const a=G.time*1.2;
    ctx.fillStyle='#7ae0ff'; ctx.fillRect(Math.round(e.x+Math.cos(a)*9)-1,Math.round(e.y+Math.sin(a)*9)-1,2,2);
  }
  // 处决标记：红圈 + 颅钉
  if(e.marked){
    const bl=Math.floor(G.time*8)%2;
    ctx.strokeStyle=bl?'rgba(255,75,92,.95)':'rgba(255,75,92,.4)';
    ctx.beginPath(); ctx.arc(e.x,e.y,e.r+3,0,TAU); ctx.stroke();
    ctx.fillStyle='#ff4b5c';
    ctx.fillRect(e.x-2,e.y-e.r-9,4,2); ctx.fillRect(e.x-1,e.y-e.r-10,2,3);
  }
}
function render(){
  const glowOn=G.meta.settings.glow;
  ctx.setTransform(1,0,0,1,0,0);
  if(G.shake>0){
    ctx.translate(Math.round(rand(-G.shake,G.shake)),Math.round(rand(-G.shake,G.shake)));
  }
  ctx.fillStyle='#0a0810'; ctx.fillRect(-6,-6,W+12,H+12);
  ctx.drawImage(G.floorCv,0,0);
  ctx.drawImage(G.decalCv,0,0);
  // 仪式圈微光
  ctx.fillStyle='rgba(120,20,36,'+(0.10+Math.sin(G.time*1.3)*.04)+')';
  ctx.beginPath(); ctx.arc(W/2,H/2,66,0,TAU); ctx.fill();
  drawPentagram(W/2,H/2,52,'rgba(255,60,60,.16)',1);
  // 蜡烛与火盆
  for(const c of G.cands){
    ctx.drawImage(S.candle.spr, Math.round(c.x-S.candle.spr.width/2), Math.round(c.y-S.candle.spr.height+1));
    flameAt(c.x,c.y-4,1.4,c.ph);
  }
  for(const b of G.braz){
    ctx.fillStyle='#5f5a68'; ctx.fillRect(b.x-5,b.y+2,10,3);
    ctx.fillStyle='#8a8494'; ctx.fillRect(b.x-4,b.y-1,8,3);
    ctx.fillStyle='#3a3642'; ctx.fillRect(b.x-4,b.y+2,8,2);
    flameAt(b.x,b.y-3,2.2,b.ph);
  }
  // 祭坛与石柱
  for(const o of G.ob){
    if(o.kind==='altar'){
      ctx.fillStyle='#4a3a44'; ctx.fillRect(o.x-o.w/2,o.y-o.h/2,o.w,o.h);
      ctx.fillStyle='#2c2028'; ctx.fillRect(o.x-o.w/2+2,o.y-o.h/2+2,o.w-4,o.h-4);
      ctx.fillStyle='#7a2430'; ctx.fillRect(o.x-2,o.y-1,4,2);
      ctx.drawImage(S.candle.spr, Math.round(o.x-o.w/2+2), Math.round(o.y-S.candle.spr.height+2));
      ctx.drawImage(S.candle.spr, Math.round(o.x+o.w/2-5), Math.round(o.y-S.candle.spr.height+2));
      flameAt(o.x-o.w/2+3.5,o.y-2,1.3,o.x+o.y);
      flameAt(o.x+o.w/2-3.5,o.y-2,1.3,o.x+o.y+3);
    } else if(o.kind==='pillar'){
      ctx.fillStyle='#5f5a68'; ctx.fillRect(o.x-4,o.y-5,8,10);
      ctx.fillStyle='#8a8494'; ctx.fillRect(o.x-3,o.y-4,6,3);
      ctx.fillStyle='#3a3642'; ctx.fillRect(o.x-4,o.y+3,8,2);
    } else {
      ctx.fillStyle='#3a3642'; ctx.fillRect(o.x-4,o.y+3,8,4);
    }
  }
  // 传送门
  for(const p of G.portals){
    const t=p.t/p.dur, r=4+t*12;
    ctx.strokeStyle=p.big?'rgba(255,60,50,.8)':'rgba(200,40,50,.55)';
    ctx.beginPath(); ctx.arc(p.x,p.y,r,0,TAU); ctx.stroke();
    drawPentagram(p.x,p.y,Math.max(2,r*.6),'rgba(255,70,50,'+(.3+t*.5)+')',1);
    ctx.fillStyle='rgba(255,80,50,'+(.15+t*.3)+')';
    ctx.beginPath(); ctx.arc(p.x,p.y,Math.max(1,r*.4),0,TAU); ctx.fill();
  }
  // 投掷炸弹（抛物线飞行 / 落地预警圈）
  for(const b of G.bombs){
    if(b.state==='fly'){
      const k=b.t/b.dur;
      const by=b.y-Math.sin(k*Math.PI)*14;
      ctx.fillStyle='#2e2a35';
      ctx.fillRect(Math.round(b.x)-2,Math.round(by)-2,4,4);
      ctx.fillStyle=C.bomb; ctx.fillRect(Math.round(b.x)-1,Math.round(by)-1,2,2);
      ctx.fillStyle='#ffd23f'; ctx.fillRect(Math.round(b.x),Math.round(by),1,1);
    } else {
      const bl=Math.floor(G.time*14)%2;
      ctx.strokeStyle=bl?'rgba(255,90,30,.85)':'rgba(255,90,30,.35)';
      ctx.beginPath(); ctx.arc(b.tx,b.ty,12,0,TAU); ctx.stroke();
      ctx.fillStyle=bl?'rgba(255,90,30,.3)':'rgba(255,90,30,.12)';
      ctx.beginPath(); ctx.arc(b.tx,b.ty,11,0,TAU); ctx.fill();
    }
  }
  // 拾取物
  for(const g of G.gems){
    const c=g.tier==='gemY'?C.gemY:g.tier==='gemP'?C.gemP:g.tier==='gemG'?C.gemG:C.gemC;
    ctx.fillStyle=c;
    ctx.fillRect(Math.round(g.x)-2,Math.round(g.y)-1,4,3);
    ctx.fillRect(Math.round(g.x)-1,Math.round(g.y)-2,3,4);
    ctx.fillStyle='#fff';
    ctx.fillRect(Math.round(g.x),Math.round(g.y),1,1);
  }
  for(const p of G.pickups){
    if(p.kind==='item'){
      const it=ITEMS[p.type];
      const bob=Math.sin(G.time*4+p.seed)*1.5;
      ctx.globalAlpha=p.t<4?(Math.floor(G.time*8)%2?.4:1):1;
      ctx.globalCompositeOperation='lighter';
      ctx.fillStyle=it.col;
      ctx.fillRect(Math.round(p.x)-3,Math.round(p.y)-1+bob,6,3);
      ctx.fillRect(Math.round(p.x)-1,Math.round(p.y)-3+bob,3,6);
      ctx.globalCompositeOperation='source-over';
      ctx.fillStyle='#fff';
      ctx.fillRect(Math.round(p.x),Math.round(p.y)+bob,1,1);
      ctx.globalAlpha=1;
      ctx.strokeStyle=it.col;
      ctx.beginPath(); ctx.arc(p.x,p.y+bob,7+Math.sin(G.time*5+p.seed)*1.5,0,TAU); ctx.stroke();
    } else if(p.kind==='heart'){
      const bob=Math.sin(G.time*5+p.x)*1;
      ctx.globalAlpha=p.t<3?(Math.floor(G.time*8)%2?.3:1):1;
      ctx.drawImage(S.heart.spr, Math.round(p.x-S.heart.spr.width/2), Math.round(p.y-S.heart.spr.height/2+bob));
      ctx.globalAlpha=1;
    } else {
      const bob=Math.sin(G.time*4+p.x)*1.5;
      ctx.fillStyle=p.rare?'#ffd23f':'#ff8a1e';
      ctx.fillRect(p.x-6,p.y-1+bob,10,2);
      ctx.fillStyle=p.rare?'#fff':'#7d858c';
      ctx.fillRect(p.x-4,p.y+bob,2,4); ctx.fillRect(p.x+2,p.y+bob,2,4);
    }
  }
  if(G.chest&&!G.chest.open){
    const spr=S.chest.spr;
    ctx.drawImage(spr,Math.round(G.chest.x-spr.width/2),Math.round(G.chest.y-spr.height/2));
    ctx.fillStyle='rgba(255,210,63,.25)';
    ctx.beginPath(); ctx.arc(G.chest.x,G.chest.y,11+Math.sin(G.time*3)*2,0,TAU); ctx.fill();
  }
  // 实体按 y 排序
  const ents=[];
  for(const e of G.enemies) ents.push({y:e.y,e});
  ents.push({y:P.y,p:true});
  ents.sort((a,b)=>a.y-b.y);
  for(const it of ents){
    if(it.p){
      if(P.dead){
        ctx.globalAlpha=.7;
        ctx.drawImage(S.player.spr,Math.round(P.x-S.player.spr.width/2),Math.round(P.y-S.player.spr.height/2));
        ctx.globalAlpha=1;
        ctx.fillStyle=C.blood; ctx.fillRect(P.x-6,P.y,12,2); ctx.fillRect(P.x-4,P.y-2,8,1);
        continue;
      }
      // 冲刺残影
      for(const gh of G.ghosts){
        ctx.globalAlpha=clamp(gh.t*6,.0,.35);
        ctx.drawImage(S.player.spr,Math.round(gh.x-S.player.spr.width/2),Math.round(gh.y-S.player.spr.height/2));
      }
      ctx.globalAlpha=1;
      const spr=S.player.spr;
      const w=P.weapon?P.weapon.def:null;
      // 圣盾光环
      if(P.shieldT>0){
        ctx.strokeStyle='rgba(95,212,124,'+(.5+Math.sin(G.time*8)*.2)+')';
        ctx.beginPath(); ctx.arc(P.x,P.y,9,0,TAU); ctx.stroke();
        ctx.globalCompositeOperation='lighter';
        ctx.fillStyle='rgba(95,212,124,.12)';
        ctx.beginPath(); ctx.arc(P.x,P.y,8,0,TAU); ctx.fill();
        ctx.globalCompositeOperation='source-over';
      }
      if(w && G.mode==='run'){
        ctx.save();
        ctx.translate(Math.round(P.x),Math.round(P.y));
        ctx.rotate(P.dir+Math.PI/2);
        const glen=6+(w.heavy?4:(w.en==='PENANCE SCATTER'?3:0));
        const rk=Math.round((P.recoil||0)*30);   // 后坐力：枪身回缩
        ctx.fillStyle='#2e3338';
        ctx.fillRect(1,-3-glen+rk,2,glen);      // 枪管沿瞄准方向
        ctx.fillStyle='#4a5157';
        ctx.fillRect(0,-4+rk,4,3);              // 枪身
        if(P.muzzle>0){
          ctx.fillStyle=Math.floor(G.time*24)%2?'#fff':'#ffd23f';
          ctx.fillRect(1,-6-glen,2,3);
          if(glowOn){
            ctx.globalCompositeOperation='lighter';
            ctx.fillStyle=w.col||'rgba(255,200,90,.55)';
            ctx.fillRect(0,-8-glen,2,6);
            ctx.fillStyle='rgba(255,200,90,.55)';
            ctx.fillRect(0,-9-glen,4,9);
            ctx.globalCompositeOperation='source-over';
          }
        }
        ctx.restore();
      }
      ctx.save();
      ctx.translate(Math.round(P.x),Math.round(P.y));
      ctx.rotate(P.dir+Math.PI/2);
      if(P.invulnT>0 && Math.floor(G.time*20)%2===0) ctx.globalAlpha=.45;
      ctx.drawImage(spr,-spr.width/2,-spr.height/2);
      ctx.restore();
      ctx.globalAlpha=1;
    } else drawEntity(it.e);
  }
  // 子弹（华丽版：拖尾 + 加色光晕 + 热核；弹幕超密时自动降级光晕保证帧率）
  const manyB=G.ebullets.length>250;
  for(const b of G.ebullets){
    const c=b.c;
    const a=Math.atan2(b.vy,b.vx);
    // 渐隐拖尾
    const tl=b.r>2.6?10:7;
    const segs=manyB?2:3;
    for(let k=1;k<=segs;k++){
      ctx.globalAlpha=(.34/k);
      ctx.fillStyle=c;
      ctx.fillRect(Math.round(b.x-Math.cos(a)*tl*k),Math.round(b.y-Math.sin(a)*tl*k),2,2);
    }
    ctx.globalAlpha=1;
    // 加色光晕：白热外圈 + 本色内晕（脉动）
    if(!manyB && glowOn){
      const pulse=.45+Math.sin(b.t*9+b.ph)*.15;
      ctx.globalCompositeOperation='lighter';
      ctx.globalAlpha=pulse;
      ctx.fillStyle='rgba(255,255,255,.30)';
      ctx.fillRect(Math.round(b.x)-3,Math.round(b.y)-3,6,6);
      ctx.fillStyle=c;
      ctx.fillRect(Math.round(b.x)-2,Math.round(b.y)-2,4,4);
      ctx.globalCompositeOperation='source-over';
      ctx.globalAlpha=1;
    }
    // 主体钻石
    ctx.fillStyle=c;
    ctx.fillRect(Math.round(b.x)-2,Math.round(b.y)-1,4,3);
    ctx.fillRect(Math.round(b.x)-1,Math.round(b.y)-2,3,4);
    // 白色热核
    if(b.r>2.6){ ctx.fillStyle='#fff'; ctx.fillRect(Math.round(b.x),Math.round(b.y),1,1); }
    // 追踪弹：环绕闪光
    if(b.kind==='home'){
      const s1=G.time*14+b.ph, s2=G.time*14+b.ph+Math.PI;
      ctx.globalCompositeOperation='lighter';
      ctx.fillStyle='#fff';
      ctx.fillRect(Math.round(b.x+Math.cos(s1)*4),Math.round(b.y+Math.sin(s1)*4),1,1);
      ctx.fillRect(Math.round(b.x+Math.cos(s2)*4),Math.round(b.y+Math.sin(s2)*4),1,1);
      ctx.globalCompositeOperation='source-over';
    }
    // 狙击矢：超长曳光
    if(b.sp>200){
      ctx.save();
      ctx.translate(Math.round(b.x),Math.round(b.y));
      ctx.rotate(a+Math.PI/2);
      ctx.globalCompositeOperation='lighter';
      ctx.fillStyle='rgba(255,180,60,.5)';
      ctx.fillRect(-1,-12,2,12);
      ctx.globalCompositeOperation='source-over';
      ctx.fillStyle='#fff';
      ctx.fillRect(-1,-9,2,9);
      ctx.restore();
    }
  }
  for(const b of G.pbullets){
    const L=b.heavy?10:6, W=b.heavy?3:2;
    const bc=b.c||C.pbul;
    // 加色光晕（本色）
    if(glowOn){
      ctx.globalCompositeOperation='lighter';
      ctx.globalAlpha=b.heavy?.5:.32;
      ctx.fillStyle=bc;
      ctx.fillRect(Math.round(b.x)-3,Math.round(b.y)-3,6,6);
      ctx.globalCompositeOperation='source-over';
      ctx.globalAlpha=1;
    }
    // 拖尾火星（随机变色）
    ctx.globalAlpha=.45;
    ctx.fillStyle=PBUL_PAL[Math.floor(G.time*20+b.t*40)%PBUL_PAL.length];
    ctx.fillRect(Math.round(b.x-Math.cos(b.ang)*(L+2)),Math.round(b.y-Math.sin(b.ang)*(L+2)),1,1);
    ctx.globalAlpha=1;
    ctx.save();
    ctx.translate(Math.round(b.x),Math.round(b.y));
    ctx.rotate(b.ang+Math.PI/2);
    ctx.fillStyle=bc;
    ctx.fillRect(-Math.floor(W/2),-Math.round(L*.75),W,L);
    ctx.fillStyle=b.crit?'#ffffff':'#fffbe8';
    ctx.fillRect(-1,-Math.round(L*.55),1,Math.round(L*.5));
    if(b.heavy && glowOn){
      ctx.globalCompositeOperation='lighter';
      ctx.fillStyle='rgba(255,220,140,.45)';
      ctx.fillRect(-Math.floor(W/2),-Math.round(L*.8),W,Math.round(L*.3));
      ctx.fillStyle='rgba(255,255,255,.5)';
      ctx.fillRect(-Math.floor(W/2),-Math.round(L*.85),W,2);
      ctx.globalCompositeOperation='source-over';
    }
    ctx.restore();
  }
  // 圣光加农光束
  for(const b of G.beams){
    ctx.strokeStyle=b.col; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(b.x1,b.y1); ctx.lineTo(b.x2,b.y2); ctx.stroke();
    if(glowOn){
      ctx.globalCompositeOperation='lighter';
      ctx.strokeStyle='rgba(255,255,255,.6)'; ctx.lineWidth=1;
      ctx.beginPath(); ctx.moveTo(b.x1,b.y1); ctx.lineTo(b.x2,b.y2); ctx.stroke();
      ctx.globalCompositeOperation='source-over';
    }
  }
  // 粒子（普通层 + 加色层分两遍绘制，避免逐粒子切换合成模式）
  for(const p of G.particles){
    if(p.add) continue;
    ctx.globalAlpha=clamp(p.life/p.max,0,1);
    ctx.fillStyle=p.color;
    ctx.fillRect(Math.round(p.x),Math.round(p.y),p.size,p.size);
  }
  ctx.globalCompositeOperation='lighter';
  for(const p of G.particles){
    if(!p.add) continue;
    ctx.globalAlpha=clamp(p.life/p.max,0,1);
    ctx.fillStyle=p.color;
    ctx.fillRect(Math.round(p.x),Math.round(p.y),p.size,p.size);
  }
  ctx.globalCompositeOperation='source-over';
  ctx.globalAlpha=1;
  // 体素残肢（翻滚 + 淡出）
  for(const g of G.gibs){
    const r=g.spr.rot[((Math.floor(g.rot/(Math.PI/2))%4)+4)%4];
    ctx.globalAlpha=clamp(g.life/g.max,0,1)*clamp(g.life*5,0,1);
    ctx.drawImage(r, Math.round(g.x-r.width/2), Math.round(g.y-r.height/2));
  }
  ctx.globalAlpha=1;
  // 弹幕密度危险光（越密越烫）
  if(glowOn && G.ebullets.length>120){
    const dg=Math.min(.35,(G.ebullets.length-120)/400);
    ctx.fillStyle='rgba(255,70,30,'+(dg*.22)+')';
    ctx.fillRect(0,0,W,3); ctx.fillRect(0,H-3,W,3); ctx.fillRect(0,0,3,H); ctx.fillRect(W-3,0,3,H);
  }
  // 冲击波（击杀/爆炸）
  for(const r of G.rings){
    const k=1-r.life/r.life0;
    const rr=lerp(r.r,r.max,k);
    ctx.globalAlpha=clamp(r.life/r.life0,0,1)*.8;
    ctx.strokeStyle=r.color;
    ctx.beginPath(); ctx.arc(r.x,r.y,rr,0,TAU); ctx.stroke();
  }
  ctx.globalAlpha=1;
  // 落雷
  if(G.bolt){
    const b=G.bolt;
    let x0=b.x, y0=-8;
    ctx.fillStyle='#fff6d0';
    for(let i=1;i<=5;i++){
      const t=i/5;
      const jx=i===5?b.x:b.x+rand(-10,10);
      line(x0,y0,jx,-8+(b.y+8)*t,'#fff6d0',2);
      x0=jx; y0=-8+(b.y+8)*t;
    }
    ctx.fillStyle='rgba(255,120,60,.5)'; ctx.fillRect(b.x-4,b.y-4,8,8);
  }
  // 浮动伤害
  ctx.font='7px VT323, monospace'; ctx.textAlign='center';
  for(const f of G.floaters){
    ctx.globalAlpha=clamp(f.life/f.max,0,1);
    const fy=Math.round(f.y-(1-f.life/f.max)*10);
    ctx.fillStyle='#0d0b10';                    // 描边阴影
    ctx.fillText(f.txt,Math.round(f.x)+1,fy+1);
    ctx.fillStyle=f.color;
    ctx.fillText(f.txt,Math.round(f.x),fy);
  }
  ctx.globalAlpha=1;
  ctx.setTransform(1,0,0,1,0,0);
}
function flameAt(x,y,s,ph){
  const f=Math.sin(G.time*11+ph)*.6+Math.cos(G.time*7+ph*2)*.4;
  ctx.globalCompositeOperation='lighter';
  ctx.fillStyle='rgba(255,110,30,.85)';
  ctx.fillRect(Math.round(x-s),Math.round(y-s+f*.5),Math.round(s*2),Math.round(s*2));
  ctx.fillStyle='rgba(255,210,90,.9)';
  ctx.fillRect(Math.round(x-s*.5),Math.round(y-s*.6+f*.7),Math.round(s),Math.round(s));
  ctx.globalCompositeOperation='source-over';
}

/* ---------------- HUD ---------------- */
function renderSegs(){
  const segs=$('hpsegs'), n=Math.max(1,Math.ceil(P.hpMax/25));
  if(segs.childElementCount!==n){
    segs.innerHTML='';
    for(let i=0;i<n;i++){ const d=document.createElement('i'); d.className='seg'; segs.appendChild(d); }
    G.hudc.scls=[];
  }
  const low=P.hp<P.hpMax*.3;
  for(let i=0;i<n;i++){
    const v=P.hp-i*25;
    const cls='seg'+(v>0?' on':'')+(low?' low':'');
    if(G.hudc.scls[i]!==cls){ G.hudc.scls[i]=cls; segs.children[i].className=cls; }
  }
}
function drawRadar(){
  const rc=$('radar').getContext('2d');
  rc.fillStyle='#0c1016'; rc.fillRect(0,0,48,48);
  rc.strokeStyle='rgba(120,130,140,.14)';
  for(let i=8;i<48;i+=8){ rc.beginPath(); rc.moveTo(i,0); rc.lineTo(i,48); rc.stroke(); rc.beginPath(); rc.moveTo(0,i); rc.lineTo(48,i); rc.stroke(); }
  rc.strokeStyle='rgba(255,138,30,.25)';
  rc.strokeRect(.5,.5,47,47);
  // 扫描线
  const a=G.time*1.6;
  rc.strokeStyle='rgba(255,138,30,.5)';
  rc.beginPath(); rc.moveTo(24,24); rc.lineTo(24+Math.cos(a)*22,24+Math.sin(a)*22); rc.stroke();
  for(const e of G.enemies){
    const x=clamp(e.x/480*48,1,47), y=clamp(e.y/270*48,1,47);
    rc.fillStyle=(e.def&&e.def.boss)?'#ff4b5c':'#ff8a1e';
    rc.fillRect(Math.round(x)-1,Math.round(y)-1,(e.def&&e.def.boss)?3:2,(e.def&&e.def.boss)?3:2);
  }
  if(G.chest&&!G.chest.open){ rc.fillStyle='#ffd23f'; rc.fillRect(Math.round(G.chest.x/10)-1,Math.round(G.chest.y/5.6)-1,2,2); }
  for(const p of G.pickups){ if(p.kind==='weapon'){ rc.fillStyle='#7ae0ff'; rc.fillRect(Math.round(p.x/10),Math.round(p.y/5.6),2,2); } }
  rc.fillStyle='#fff'; rc.fillRect(23,23,2,2);
  const pa=P.dir;
  rc.fillStyle='#ffe9a8'; rc.fillRect(24+Math.cos(pa)*3-1,24+Math.sin(pa)*3-1,2,2);
}
function showBossBar(on){
  if(G._bb===on) return;
  G._bb=on;
  $('bossbar').style.display=on?'block':'none';
}
function updateHUD(){
  const hc=G.hudc;
  if(G.mode==='title'||G.mode==='shop'||G.mode==='dead'){
    if(hc.vis!==0){
      hc.vis=0;
      for(const id of ['pTL','pTR','pTC','pBL','pBR']) $(id).style.display='none';
      $('crosshair').style.display='none';
      showBossBar(false);
    }
    return;
  }
  if(hc.vis!==1){
    hc.vis=1;
    for(const id of ['pTL','pTR','pTC','pBL','pBR']) $(id).style.display='block';
  }
  renderSegs();
  const hpN=Math.ceil(P.hp);
  if(hc.hp!==hpN){ hc.hp=hpN; $('hpnum').textContent=hpN; }
  if(hc.lvl!==G.level){ hc.lvl=G.level; $('lvl').textContent=G.level; }
  const xpP=Math.round(clamp(G.xp/G.need*100,0,100));
  if(hc.xp!==xpP){ hc.xp=xpP; $('xpfill').style.width=xpP+'%'; }
  if(hc.so!==G.runSouls){ hc.so=G.runSouls; $('souls').textContent=G.runSouls; }
  if(hc.sc!==G.score){
    hc.sc=G.score;
    $('score').textContent=G.score; $('scoremid').textContent=G.score;
    const se=$('score');
    try{ se.classList.remove('pop'); void se.offsetWidth; se.classList.add('pop'); }catch(e2){}
  }
  if(hc.gr!==G.graze){ hc.gr=G.graze; $('graze').textContent=G.graze; }
  if(hc.ki!==G.kills){ hc.ki=G.kills; $('kills').textContent=G.kills; }
  // 连击
  if(G.combo>0){
    if(hc.cbv!==1){ hc.cbv=1; $('comborow').style.display='block'; }
    if(hc.cb!==G.combo){
      hc.cb=G.combo;
      const el=$('combo');
      el.textContent='×'+G.combo;
      el.className=G.combo<10?'c1':(G.combo<25?'c2':'c3');
      try{ el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop'); }catch(e2){}
    }
    const cw=Math.round(clamp(G.comboT/2.5,0,1)*100);
    if(hc.cw!==cw){ hc.cw=cw; $('combofill').style.width=cw+'%'; }
  } else if(hc.cbv!==0){ hc.cbv=0; $('comborow').style.display='none'; }
  const be=Math.max(G.best,G.wave);
  if(hc.be!==be){ hc.be=be; $('best').textContent=be; }
  if(hc.wv!==G.wave || hc.dv!==(G.daily?1:0)){
    hc.wv=G.wave; hc.dv=G.daily?1:0;
    $('wavetxt').innerHTML='WAVE <i>'+G.wave+'</i>'+(hc.dv?'<b class="dailytag">每日试炼</b>':'');
  }
  // Boss 预告
  let bsh='';
  if(G.waveState==='active'||G.waveState==='clear'){
    if(G.wave%5===0) bsh=G.boss?'☠ BOSS 战中':'☠ BOSS WAVE';
    else bsh='距 Boss 还有 '+(Math.ceil(G.wave/5)*5-G.wave)+' 波';
  }
  if(hc.bsh!==bsh){
    hc.bsh=bsh;
    $('bosshint').textContent=bsh;
    $('bosshint').style.display=bsh?'block':'none';
  }
  const hn=G.enemies.length+(G.portals.length?('+'+G.portals.length):'')+(G.toSpawn.length?('+'+G.toSpawn.length):'');
  if(hc.hn!==hn){ hc.hn=hn; $('hcount').textContent=hn; }
  if(G.waveState==='clear'){
    if(hc.calv!==1){ hc.calv=1; $('calmtxt').style.display='block'; }
    const ct='—— 下一波 '+Math.ceil(G.clearT)+'s ——';
    if(hc.ct!==ct){ hc.ct=ct; $('calmtxt').textContent=ct; }
  } else if(hc.calv!==0){ hc.calv=0; $('calmtxt').style.display='none'; }
  if(P.weapon){
    // 武器槽位按钮（差异缓存渲染）
    let sk=P.wi+':';
    for(let i=0;i<4;i++){ const s=P.slots[i]; sk+=(s?(s.def.en+(s.rare?'R':'')+s.ammo):'0'); }
    if(hc.wslots!==sk){
      hc.wslots=sk;
      let html='';
      for(let i=0;i<4;i++){
        const s=P.slots[i];
        html+=s
          ? `<button class="slot${i===P.wi?' on':''}${s.rare?' rare':''}" data-slot="${i}"><span class="sk">${i+1}</span>${s.def.name}<i>${s.ammo}</i></button>`
          : `<button class="slot empty" data-slot="${i}"><span class="sk">${i+1}</span>——<i>空</i></button>`;
      }
      $('wslots').innerHTML=html;
    }
    const am=magSize();
    if(hc.am!==P.ammo||hc.ammax!==am){
      hc.am=P.ammo; hc.ammax=am;
      $('amnow').textContent=P.ammo;
      $('ammax').textContent=am;
    }
    if(P.reloadT>0){
      const tot=P.weapon.def.reload*P.stats.reload;
      const rp=Math.round((1-P.reloadT/tot)*100);
      if(hc.rp!==rp){ hc.rp=rp; $('relfill').style.width=rp+'%'; }
      if(hc.rh!==1){ hc.rh=1; $('relhint').textContent='装填中……'; }
    } else {
      if(hc.rp!==0){ hc.rp=0; $('relfill').style.width='0%'; }
      if(hc.rh!==0){ hc.rh=0; $('relhint').textContent='R 装填 · 空格 冲刺 · Q 圣餐'; }
    }
  }
  const dk=P.dashMax+':'+P.dashCharges;
  if(hc.dk!==dk){
    hc.dk=dk;
    let dph='';
    for(let i=0;i<P.dashMax;i++) dph+='<i class="pip'+(i<P.dashCharges?' on':'')+'"></i>';
    $('dashpips').innerHTML=dph;
  }
  const fk=P.flaskMax+':'+P.flask;
  if(hc.fk!==fk){
    hc.fk=fk;
    let fp='';
    for(let i=0;i<P.flaskMax;i++) fp+='<i class="pip f'+(i<P.flask?' on':'')+'"></i>';
    $('flaskpips').innerHTML=fp;
  }
  if(G.boss&&G.mode==='run'){
    showBossBar(true);
    const bn=G.boss.def.name+' // '+G.boss.def.en;
    if(hc.bn!==bn){ hc.bn=bn; $('bossname').textContent=bn; }
    const bw=Math.round(clamp(G.boss.hp/G.boss.hpMax*100,0,100));
    if(hc.bw!==bw){ hc.bw=bw; $('bbfill').style.width=bw+'%'; }
  } else { showBossBar(false); hc.bw=-1; }
  const cd=(G.mode==='run'&&!G.paused)?1:0;
  if(hc.cd!==cd){ hc.cd=cd; $('crosshair').style.display=cd?'block':'none'; }
  const cr=(P.reloadT>0?'reload':'')+(G.crossHitT>0?' hit':'');
  if(hc.cr!==cr){ hc.cr=cr; $('crosshair').className=cr; }
  // 准星开火扩散
  const bloom=Math.round(clamp((P.fireCd||0)*3,0,1)*5)/5;
  if(hc.bloom!==bloom){
    hc.bloom=bloom;
    $('crosshair').style.transform='translate(-50%,-50%) scale('+(1+bloom*.55)+')';
  }
}

function rollCards(){
  const cards=[];
  const pool=UPS.filter(u=>upStacks(u)<u.max);
  while(cards.length<3){
    const r=srnd();
    const tier=r<.55?'common':(r<.88?'rare':'legend');
    let cands=pool.filter(u=>u.tier===tier&&!cards.includes(u));
    if(!cands.length) cands=pool.filter(u=>!cards.includes(u));
    if(!cands.length) break;
    cards.push(srPick(cands));
  }
  G.curCards=cards;
}

        <div class="si"><span>本局灵魂</span><b>+${G.runSouls}${legacyBonus>0?' +'+legacyBonus+'遗产':''}${dailyBonus>0?' +'+dailyBonus+'每日':''}${indulgence>0?' +'+indulgence+'赎罪':''}</b></div>
        <div class="si"><span>本局成就</span><b>${G.achRun||0}</b>${G.daily?'<span>（每日试炼）</span>':''}</div>
        <div class="si"><span>最佳记录</span><b>第 ${G.meta.best} 波</b></div>
      </div>
      <div class="btnrow">
        <button class="primary" data-act="shop">回到圣所 ▸</button>
        <button data-act="again">再来一局</button>
      </div>
      <div class="flavor">尸体被拖回了墓园。灵魂留下了。</div>
      <div class="t-foot">Made By Nob0dyH3re</div>
    </div>`);
}
function saveMeta(){ try{ localStorage.setItem('sm_meta',JSON.stringify(G.meta)); }catch(e){} }
/* ---------------- 中途存档（继续血战） ---------------- */
function hasRunSave(){ try{ return !!localStorage.getItem('sm_run'); }catch(e){ return false; } }
function saveRun(){
  if((G.mode!=='run'&&G.mode!=='pause')||P.dead||G.waveState==='calm'&&G.wave===0) return;
  try{
    const data={
      v:3,
      P:{x:P.x,y:P.y,hp:P.hp,hpMax:P.hpMax,flask:P.flask,flaskMax:P.flaskMax,
         dashMax:P.dashMax,dashCharges:P.dashCharges,dashCd:P.dashCd,
         slots:P.slots.map(s=>s?{k:Object.keys(WEAPONS).find(k=>WEAPONS[k]===s.def),rare:s.rare,ammo:s.ammo,reloadT:s.reloadT}:null),
         wi:P.wi,ammo:P.ammo,reloadT:P.reloadT,stats:P.stats},
      G:{wave:G.wave,level:G.level,xp:G.xp,need:G.need,runSouls:G.runSouls,kills:G.kills,
         combo:G.combo,graze:G.graze,score:G.score,bossWave:G.bossWave,bossKey:G.bossKey,
         nextWaveMul:G.nextWaveMul,xpWavesLeft:G.xpWavesLeft,pendingLevels:G.pendingLevels,
         daily:G.daily,
         chest:G.chest?{x:G.chest.x,y:G.chest.y,open:G.chest.open}:null,
         toSpawn:G.toSpawn.slice(0,40)},
      enemies:G.enemies.slice(0,30).map(e=>({t:e.type,x:Math.round(e.x),y:Math.round(e.y),hp:Math.round(e.hp)})),
      pickups:G.pickups.slice(0,12).map(p=>({k:p.kind,x:p.x,y:p.y,t:p.t,w:p.wtype,r:p.rare,ty:p.type})),
    };
    localStorage.setItem('sm_run', JSON.stringify(data));
  }catch(e){}
}
function loadRun(){
  try{
    const d=JSON.parse(localStorage.getItem('sm_run')||'null');
    if(!d||!d.P||!d.P.stats) return false;
    startRun(!!d.G.daily);
    P.x=d.P.x; P.y=d.P.y; P.hp=d.P.hp; P.hpMax=d.P.hpMax;
    P.flask=d.P.flask; P.flaskMax=d.P.flaskMax;
    P.dashMax=d.P.dashMax; P.dashCharges=d.P.dashCharges; P.dashCd=d.P.dashCd;
    P.slots=d.P.slots.map(s=>s?{def:WEAPONS[s.k],rare:s.rare,ammo:s.ammo,reloadT:s.reloadT}:null);
    P.wi=d.P.wi; P.weapon=P.slots[P.wi]; P.ammo=d.P.ammo; P.reloadT=d.P.reloadT;
    P.stats=d.P.stats;
    G.wave=d.G.wave; G.waveState='active'; G.level=d.G.level; G.xp=d.G.xp; G.need=d.G.need;
    G.runSouls=d.G.runSouls; G.kills=d.G.kills; G.combo=d.G.combo; G.graze=d.G.graze; G.score=d.G.score;
    G.bossWave=d.G.bossWave; G.bossKey=d.G.bossKey; G.nextWaveMul=d.G.nextWaveMul||1;
    G.xpWavesLeft=d.G.xpWavesLeft||0; G.pendingLevels=d.G.pendingLevels||0;
    G.chest=d.G.chest?{x:d.G.chest.x,y:d.G.chest.y,opening:0,open:d.G.chest.open}:null;
    G.toSpawn=d.G.toSpawn||[];
    for(const e of d.enemies||[]){ if(ETYPES[e.t]){ const n=spawnEnemy(e.t,e.x,e.y); n.hp=e.hp; } }
    for(const p of d.pickups||[]){
      if(p.k==='item') dropItem(p.x,p.y,p.ty);
      else if(p.k==='heart') G.pickups.push({kind:'heart',x:p.x,y:p.y,t:p.t||20});
      else if(p.k==='weapon') G.pickups.push({kind:'weapon',x:p.x,y:p.y,t:p.t||20,wtype:p.w,rare:p.r});
    }
    G.mode='run'; ov.innerHTML=''; G.paused=false;
    try{ localStorage.removeItem('sm_run'); }catch(e){}
    banner('血战继续','CONTINUE · 第 '+G.wave+' 波');
    toast('存档已读取。');
    return true;
  }catch(e){ return false; }
}
function startRun(daily){
  // 重置
  G.enemies=[]; G.ebullets=[]; G.pbullets=[]; G.gems=[]; G.pickups=[]; G.particles=[]; G.floaters=[]; G.ghosts=[];
  G.portals=[]; G.toSpawn=[]; G.chest=null; G.bolt=null; G.boss=null;
  G.wave=0; G.waveState='calm'; G.kills=0; G.level=1; G.xp=0; G.need=12; G.runSouls=0;
  G.time=0; G.ts=1; G.tsTarget=1; G.shake=0; G.hitstop=0; G.dying=0; G.paused=false; G.pendingEvent=false;
  G.nextWaveMul=1; G.xpWavesLeft=0; G.bossWave=false; G.bossPortaled=false;
  G.bellT=8; G.hbT=0; G.pendingLevels=0; G.eventT=0;
  G._errN=0; G.lowPulse=false; G._bb=undefined;
  G.bombs=[]; G.rings=[]; G.gibs=[]; G.beams=[]; G.slowT=0; G.tsTarget=1; G.crossHitT=0;
  G.combo=0; G.comboT=0; G.comboMax=0; G.graze=0; G.score=0;
  G.carnCount=0; G.lastKillT=-99; G.musicT=0; G.musicStep=0; G.bossKey=null; G.grazeHealT=0;
  G.achRun=0; G.autoSaveT=20; G.saveMetaT=30;
  // 每日试炼：命运已定（种子决定卡池与掉落）
  G.daily=!!daily;
  if(G.daily){ G.dseed=dailySeed(); G.drng=mulberry32(G.dseed); banner('每日试炼','DAILY TRIAL · 命运已定 · 灵魂 +50%'); }
  else { G.drng=null; }
  mstat('runs',1);
  if(G.meta.stats.runs>=10) giveAch('runs10');
  $('errbox').style.display='none';
  P.x=W/2; P.y=H/2; P.r=3.5; P.hp=100+shopLv('vital')*10; P.hpMax=P.hp; P.dead=false; P.ammo=12;
  P.dashT=0; P.dashCd=0; P.invulnT=1; P.lastHit=-99; P.rageT=0; P.reloadT=0; P.fireCd=0;
  P.flaskMax=1+shopLv('flask'); P.flask=P.flaskMax; P.regenT=0; P.boltT=0; P.thornT=0; P.muzzle=0;
  P.stats={ dmg:1, rof:1, speed:1+shopLv('fleet')*.04, mag:1+shopLv('mag')*.12, reload:1,
    pierce:0, pellets:0, crit:.05, lifesteal:0, thorns:0, magnet:16, dashCd:1, dashCharges:0,
    regen:0, explodeCh:0, bolt:0, lowHp:0, revive:false, rage:false, revenge:0,
    grazeHeal:0, comboAmp:1, exec:false, hunter:1, ricochet:0, soulForge:0, kata:false,
    adren:false, chain:false, bloodlust:false, palisade:1, mark:false, _taken:{} };
  P.dashMax=1; P.dashCharges=1;
  P.slots=[{def:WEAPONS.pistol,rare:false,ammo:magSizeFor(WEAPONS.pistol),reloadT:0},null,null,null];
  P.wi=0; P.weapon=P.slots[0]; P.ammo=P.slots[0].ammo; P.reloadT=0; P.swapT=0; P.recoil=0;
  P.lustT=0; P.chainT=0; P.adrenT=0; P.markT=4; P.emptyTick=0; P.furyT=0; P.shieldT=0; P.shotN=0;
  // 局外开局道具
  if(shopLv('detonator')>0){
    dropItem(P.x+10,P.y,'nova');
    if(shopLv('detonator')>=2) dropItem(P.x-10,P.y,'nova');
  }
  if(shopLv('clockmaker')>0){ G.slowT=3; G.tsTarget=.45; }
  if(shopLv('zealblood')>0){ P.furyT=4*shopLv('zealblood'); }
  // 军械库：开局额外随机武器（局外升级）
  const extras=shopLv('arsenal');
  if(extras>0){
    const pool=Object.keys(WEAPONS).filter(k=>k!=='pistol');
    for(let i=0;i<Math.min(extras,3)&&pool.length;i++){
      const k=srPick(pool); pool.splice(pool.indexOf(k),1);
      const def=WEAPONS[k];
      P.slots[1+i]={def,rare:srnd()<.1,ammo:magSizeFor(def),reloadT:0};
    }
  }
  G.rerollCount=0;
  for(let i=0;i<shopLv('relic');i++){
    const c=srPick(COMMONS); takeUp(c); c.apply();
  }
  makeObstacles(); buildFloor();
  G.mode='run';
  ov.innerHTML='';
  G.calmT=3; G.waveState='calm'; G.preT=3;
  banner('弥撒开始','THE MASS BEGINS · 别让烛火熄灭');
  sfx('level');
  toast('WASD 移动 · 鼠标射击 · 空格冲刺');
}
function handleAct(act,btn){
  AU.init();
  sfx('ui');
  switch(act){
    case 'enter': case 'back': G.resetArm=false; openShop(); break;
    case 'tab-up': openShop('up'); break;
    case 'tab-ach': openShop('ach'); break;
    case 'tab-codex': openShop('codex'); break;
    case 'start': G.resetArm=false; startRun(false); break;
    case 'again': G.resetArm=false; startRun(false); break;
    case 'daily': G.resetArm=false; startRun(true); break;
    case 'resumerun': if(!loadRun()){ toast('存档已损坏或过期。'); openShop(); } break;
    case 'full': try{ if(document.documentElement.requestFullscreen) document.documentElement.requestFullscreen(); }catch(e){} break;
    case 'reset':{
      if(!G.resetArm){ G.resetArm=true; openShop(); }
      else {
        G.resetArm=false;
        const muted=G.meta.muted;
        G.meta={souls:0,best:0,bestScore:0,shop:{},muted:muted,
          stats:{runs:0,deaths:0,kills:0,bosses:0,graze:0,maxCombo:0,itemsUsed:0,weaponsFound:0,playSec:0},
          ach:{}, killsByType:{}, daily:{date:'',best:0},
          settings:G.meta.settings};
        saveMeta();
        openShop();
        toast('进度已重置。干干净净的墓园。');
      }
      break;}
    case 'shop': G.resetArm=false; openShop(); break;
    case 'toggleMute': G.meta.muted=!G.meta.muted; AU.muted=G.meta.muted;
      applyVol(); saveMeta();
      if(G.mode==='title') openTitle(); else if(G.mode==='pause') openPause();
      break;
    case 'volup': G.meta.settings.vol=Math.min(1,Math.round((G.meta.settings.vol+.1)*10)/10); applyVol(); saveMeta(); openPause(); break;
    case 'voldn': G.meta.settings.vol=Math.max(0,Math.round((G.meta.settings.vol-.1)*10)/10); applyVol(); saveMeta(); openPause(); break;
    case 'shaketog': G.meta.settings.shake=!G.meta.settings.shake; saveMeta(); openPause(); break;
    case 'glowtog': G.meta.settings.glow=!G.meta.settings.glow; saveMeta(); openPause(); break;
    case 'resume': G.mode='run'; G.paused=false; ov.innerHTML=''; break;
    case 'savequit': saveRun(); openTitle(); break;
    case 'build': openBuild(true); break;
    case 'closebuild': closeBuild(); break;
    case 'abandon': { const lb=Math.ceil(G.runSouls*.15*shopLv('legacy')); G.meta.souls+=G.runSouls+lb; G.meta.best=Math.max(G.meta.best,G.wave); G.meta.bestScore=Math.max(G.meta.bestScore||0,G.score); saveMeta(); openShop(); break; }
    case 'reroll': if(G.rerollCount<1+shopLv('dice')){ G.rerollCount++; rollCards(); renderCards(); } break;
    case 'evtskip': G.mode='run'; G.paused=false; ov.innerHTML=''; toast('神谕叹了口气。'); break;
    case 'card':{
      const u=UPS.find(x=>x.id===btn.dataset.id);
      if(u){ takeUp(u); u.apply(); sfx('level'); toast('获得：'+u.name); }
      if(G.pendingLevels>0){ openLevelUp(); }
      else { G.mode='run'; G.paused=false; ov.innerHTML=''; }
      break;}
    case 'evt':{
      const e=G.curEvents.find(x=>x.id===btn.dataset.id);
      G.mode='run'; G.paused=false; ov.innerHTML='';
      if(e){ e.f(); banner(e.name,e.en); }
      break;}
    case 'buy':{
      const s=SHOP.find(x=>x.id===btn.dataset.id);
      const lv=shopLv(s.id), cost=s.cost(lv);
      if(lv<s.max && G.meta.souls>=cost){
        G.meta.souls-=cost; G.meta.shop[s.id]=lv+1; saveMeta(); openShop();
        if(lv+1>=s.max) giveAch('maxed');
      }
      break;}
  }
}
ov.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');
  if(b) handleAct(b.dataset.act,b);
});

/* ---------------- 输入 ---------------- */
const keys={};
addEventListener('keydown',e=>{
  if(e.code==='Space'||e.code==='ArrowUp'||e.code==='ArrowDown'||e.code==='ArrowLeft'||e.code==='ArrowRight') e.preventDefault();
  if(e.code==='Tab') e.preventDefault();
  keys[e.code]=true;
  if(e.repeat) return;
  if(e.code==='KeyM'){ AU.init(); G.meta.muted=!G.meta.muted; AU.muted=G.meta.muted; applyVol(); saveMeta(); toast(G.meta.muted?'已静音':'声音开启'); return; }
  if(G.mode==='run'){
    if(e.code==='KeyR'){ startReload(false); }
    if(e.code==='KeyQ'){ useFlask(); }
    if(e.code==='Space'||e.code==='ShiftLeft'||e.code==='ShiftRight'){ doDash(); }
    if(e.code==='Digit1'||e.code==='Digit2'||e.code==='Digit3'||e.code==='Digit4'){ switchWeapon(+e.code.slice(5)-1); }
    if(e.code==='Tab'||e.code==='KeyB'){ openBuild(false); }
    if(e.code==='Escape'||e.code==='KeyP'){ openPause(); }
  } else if(G.mode==='build'){
    if(e.code==='Tab'||e.code==='KeyB'||e.code==='Escape'||e.code==='KeyP'){ closeBuild(); }
  } else if(G.mode==='pause'){
    if(e.code==='Escape'||e.code==='KeyP'){ G.mode='run'; G.paused=false; ov.innerHTML=''; }
  } else if(G.mode==='title'){
    if(e.code==='Enter'||e.code==='Space'){ AU.init(); openShop(); }
  }
});
addEventListener('keyup',e=>{ keys[e.code]=false; });
addEventListener('mousemove',e=>{
  const r=cv.getBoundingClientRect();
  G.mx=(e.clientX-r.left)/G.cssScale;
  G.my=(e.clientY-r.top)/G.cssScale;
  const ch=$('crosshair');
  ch.style.left=e.clientX+'px'; ch.style.top=e.clientY+'px';
});
addEventListener('mousedown',e=>{
  AU.init();
  if(e.button===0) G.fire=true;
  if(e.button===2){ e.preventDefault(); if(G.mode==='run') startReload(false); }
});
addEventListener('mouseup',e=>{ if(e.button===0) G.fire=false; });
addEventListener('wheel',e=>{ if(G.mode==='run'&&!G.paused){ cycleWeapon(e.deltaY>0?1:-1); } },{passive:true});
$('wslots').addEventListener('click',e=>{
  const b=e.target.closest('[data-slot]');
  if(b && G.mode==='run' && !G.paused) switchWeapon(+b.dataset.slot);
});
addEventListener('contextmenu',e=>e.preventDefault());
addEventListener('blur',()=>{ for(const k in keys) keys[k]=false; G.fire=false; });
document.addEventListener('visibilitychange',()=>{ if(document.hidden&&G.mode==='run'&&!P.dead) openPause(); });

/* ---------------- 主循环 ---------------- */
let lastT=performance.now();
function frame(now){
  try{
    let rdt=Math.min((now-lastT)/1000,.05); lastT=now;
    G.time+=rdt;
    if(G.hitstop>0){ G.hitstop-=rdt; }
    else {
      G.ts=lerp(G.ts,G.tsTarget,.06);
      const dt=rdt*G.ts*(G.paused?0:1);
      if(dt>0) update(dt);
    }
    render();
    updateHUD();
    if(G.mode==='run'||G.mode==='title') drawRadar();
  }catch(err){
    // 单帧异常不再杀死游戏循环
    if((G._errN=(G._errN||0)+1)<=3) showErr(err);
  }
  requestAnimationFrame(frame);
}
function update(dt){
  // 标题屏氛围
  if(G.mode==='title'){
    for(const e of G.enemies) upEnemy(e,dt);
    upParticles(dt);
    return;
  }
  if(G.mode!=='run'){ upParticles(dt); return; }
  if(P.dead){
    G.dying-=dt;
    upParticles(dt);
    upGibs(dt);
    for(const e of G.enemies) upEnemy(e,dt*.4);
    upBullets(dt*.4);
    if(G.dying<=0&&G.mode==='run'){ openDead(); }
    return;
  }
  // 战前倒计时
  if(G.waveState==='calm'&&G.wave===0){
    G.preT-=dt;
    if(G.preT<=0) startWave(1);
    upParticles(dt);
    return;
  }
  upWaves(dt);
  upPortals(dt);
  upPlayer(dt);
  for(const e of G.enemies) upEnemy(e,dt);
  upBullets(dt);
  upBombs(dt);
  upPickups(dt);
  upParticles(dt);
  for(let i=G.floaters.length-1;i>=0;i--){ const f=G.floaters[i]; f.life-=dt; if(f.life<=0)G.floaters.splice(i,1); }
  for(let i=G.ghosts.length-1;i>=0;i--){ G.ghosts[i].t-=dt; if(G.ghosts[i].t<=0)G.ghosts.splice(i,1); }
  for(let i=G.rings.length-1;i>=0;i--){ G.rings[i].life-=dt; if(G.rings[i].life<=0)G.rings.splice(i,1); }
  for(let i=G.beams.length-1;i>=0;i--){ G.beams[i].life-=dt; if(G.beams[i].life<=0)G.beams.splice(i,1); }
  upGibs(dt);
  // 连击倒计时
  if(G.combo>0){ G.comboT-=dt; if(G.comboT<=0){ G.combo=0; } }
  if(G.crossHitT>0) G.crossHitT-=dt;
  // 战斗鼓点：敌人越多，心越急
  if(G.enemies.length>0){
    G.musicT-=dt;
    if(G.musicT<=0){
      G.musicT=G.boss?.36:.5;
      sfx('kick');
      G.musicStep=(G.musicStep||0)+1;
      if(G.musicStep%2===0) AU.noise({lp:0,cut:3000,vol:.04,dur:.04});
    }
  }
  // 统计与自动存档
  mstat('playSec',dt);
  G.saveMetaT-=dt;
  if(G.saveMetaT<=0){ G.saveMetaT=30; saveMeta(); }
  G.autoSaveT-=dt;
  if(G.autoSaveT<=0){ G.autoSaveT=20; saveRun(); }
  G.shake=Math.max(0,G.shake-dt*14);
  // 时之沙漏恢复
  if(G.slowT>0){ G.slowT-=dt; if(G.slowT<=0){ G.slowT=0; G.tsTarget=1; } }
  if(G.waveState==='clear'){ G.clearT-=dt; if(G.clearT<=0){ startWave(G.wave+1); } }
  if(G.pendingEvent){ G.eventT-=dt; if(G.eventT<=0){ G.pendingEvent=false; openEvent(); } }
  // 钟声
  G.bellT-=dt;
  if(G.bellT<=0){ G.bellT=rand(9,16); AU.bell(); }
}
function upParticles(dt){
  for(let i=G.particles.length-1;i>=0;i--){
    const p=G.particles[i]; p.life-=dt;
    if(p.life<=0){ G.particles.splice(i,1); continue; }
    p.vy+=p.grav*dt; p.x+=p.vx*dt; p.y+=p.vy*dt;
  }
}

/* ---------------- 窗口缩放 ---------------- */
function fit(){
  const s=Math.max(1,Math.floor(Math.min(innerWidth/W,innerHeight/H)));
  G.cssScale=s;
  cv.style.width=(W*s)+'px'; cv.style.height=(H*s)+'px';
}
addEventListener('resize',fit);

/* ---------------- 启动 ---------------- */
function showErr(err){
  const el=$('errbox');
  el.style.display='block';
  el.textContent='⚠ 出错：'+(err&&err.message?err.message:err)+'（游戏未中断）';
}
window.onerror=function(m){ showErr(m); };
makeObstacles();
buildFloor();
fit();
openTitle();
requestAnimationFrame(frame);
</script>
